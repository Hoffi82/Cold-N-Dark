<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#09070d"><title>Cold N' Dark – Clan-Chat</title><style>:root{--bg:#09070d;--panel:#171122;--gold:#ffc43d;--gold2:#ff9f1c;--text:#f8f5ff;--muted:#aaa1bb;--line:#ffffff1d;--green:#45d483}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,#3b2450,#09070d 62%);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;padding-bottom:92px}.appbar{position:sticky;top:0;z-index:10;background:#08060df2;backdrop-filter:blur(16px);border-bottom:1px solid var(--line);padding:11px 14px}.inner{max-width:760px;margin:auto;display:flex;align-items:center;gap:12px}.logo{width:50px;height:50px;border-radius:14px;border:2px solid var(--gold);object-fit:cover}.brand{flex:1}.brand strong{display:block;letter-spacing:1.5px}.brand small{color:var(--gold);font-weight:900;font-size:10px}.back{color:var(--gold);font-weight:900;text-decoration:none;font-size:12px}main{max-width:760px;margin:auto;padding:18px 12px}.welcome{border:1px solid #ffc43d55;border-radius:20px;background:linear-gradient(145deg,#21152e,#100c17);padding:20px;margin-bottom:12px}.welcome h1{margin:0 0 5px;font-size:30px}.welcome p{margin:0;color:var(--muted);font-size:13px}.join{display:none;margin-top:16px}.join.show{display:block}.join label{display:block;font-weight:900;margin-bottom:7px}.join select,.join button,.composer input,.composer button{font:inherit}.join select{width:100%;padding:13px;border-radius:13px;background:#0e0a14;color:var(--text);border:1px solid var(--line)}.join button{width:100%;margin-top:9px;padding:13px;border:0;border-radius:13px;background:linear-gradient(135deg,var(--gold),var(--gold2));color:#171122;font-weight:1000;cursor:pointer}.identity{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;padding:11px 13px;border:1px solid #ffc43d33;border-radius:14px;background:#ffc43d09}.identity small{color:var(--muted);display:block}.identity b{color:var(--gold)}.change{border:1px solid #ffffff22;background:#ffffff08;color:var(--text);border-radius:9px;padding:7px 9px;font-size:11px;font-weight:900;cursor:pointer}.chat{height:calc(100vh - 330px);min-height:360px;overflow-y:auto;border:1px solid var(--line);border-radius:20px;background:#0e0a14cc;padding:14px}.msg{max-width:82%;margin:0 0 11px;padding:10px 12px;border-radius:15px 15px 15px 4px;background:#1d1527;border:1px solid #ffffff0d}.msg.me{margin-left:auto;border-radius:15px 15px 4px 15px;background:#30202f;border-color:#ffc43d2a}.meta{font-size:10px;color:var(--gold);font-weight:950;margin-bottom:3px}.time{color:#7f768b;font-weight:600;margin-left:5px}.body{font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}.empty{text-align:center;color:var(--muted);padding:50px 15px}.composer{display:flex;gap:8px;margin-top:10px}.composer input{flex:1;min-width:0;padding:13px 14px;border-radius:14px;border:1px solid var(--line);background:#120d18;color:var(--text);outline:none}.composer button{width:52px;border:0;border-radius:14px;background:linear-gradient(135deg,var(--gold),var(--gold2));font-size:20px;cursor:pointer}.composer button:disabled{opacity:.45}.hint{text-align:center;color:#766d81;font-size:10px;margin-top:7px}@media(max-width:500px){.chat{height:calc(100vh - 360px)}.msg{max-width:90%}}</style></head><body><header class="appbar"><div class="inner"><img class="logo" src="Wappen.png" alt="Cold N' Dark"><div class="brand"><strong>COLD N' DARK</strong><small>💬 CLAN-CHAT</small></div><a class="back" href="mehr-app.html">← Mehr</a></div></header><main><section class="welcome"><h1>💬 Clan-Chat</h1><p>Unser gemeinsamer Chat für den Clan.</p><div id="join" class="join"><label for="member">Wer bist du im Clan?</label><select id="member"><option value="">Spieler auswählen …</option></select><button id="joinBtn">💬 Chat betreten</button></div></section><div id="identity" class="identity" style="display:none"><div><small>Du schreibst als</small><b id="myName"></b></div><button class="change" id="changeBtn">Name ändern</button></div><section id="chat" class="chat"><div class="empty">⏳ Chat wird geladen …</div></section><form id="composer" class="composer" style="display:none"><input id="message" maxlength="500" autocomplete="off" placeholder="Nachricht schreiben …"><button title="Senden">➤</button></form><div class="hint">Bitte respektvoll miteinander umgehen. Nachrichten können von Admins moderiert werden.</div></main><script>const U='https://jvgqvtnqncelbhuordzy.supabase.co',K='sb_publishable_4PusmhJVMm0b3Bm-2Y-FPQ__tnZZzZO',H={apikey:K,Authorization:'Bearer '+K,'Content-Type':'application/json'};const GET_MEMBERS=U+'/rest/v1/clan_members?select=id,name,active&active=eq.true&order=name.asc',CHAT=U+'/rest/v1/clan_chat_messages?select=id,member_id,member_name,message,created_at&order=created_at.asc&limit=100';let members=[],me=null;const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function get(url){const r=await fetch(url,{headers:{apikey:K,Authorization:'Bearer '+K},cache:'no-store'});if(!r.ok)throw Error('Daten konnten nicht geladen werden');return r.json()}function saveMe(){localStorage.setItem('cnd_chat_member',JSON.stringify(me))}function showJoin(){ $('join').classList.add('show');$('identity').style.display='none';$('composer').style.display='none';$('chat').innerHTML='<div class="empty">👤 Wähle zuerst deinen Clan-Namen aus.</div>'}function showChat(){ $('join').classList.remove('show');$('identity').style.display='flex';$('composer').style.display='flex';$('myName').textContent=me.name;loadMessages()}function renderMessages(rows){const box=$('chat');if(!rows.length){box.innerHTML='<div class="empty">💬 Noch keine Nachrichten. Sei der Erste!</div>';return}box.innerHTML=rows.map(r=>{const d=new Date(r.created_at),mine=me&&String(r.member_id)===String(me.id);return '<div class="msg '+(mine?'me':'')+'"><div class="meta">'+esc(r.member_name)+'<span class="time">'+d.toLocaleString('de-DE',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})+'</span></div><div class="body">'+esc(r.message)+'</div></div>'}).join('');box.scrollTop=box.scrollHeight}async function loadMessages(){try{renderMessages(await get(CHAT))}catch(e){$('chat').innerHTML='<div class="empty">❌ '+esc(e.message)+'</div>'}}async function loadMembers(){try{members=await get(GET_MEMBERS);const s=$('member');s.innerHTML='<option value="">Spieler auswählen …</option>'+members.map(m=>'<option value="'+esc(m.id)+'">'+esc(m.name)+'</option>').join('');const saved=JSON.parse(localStorage.getItem('cnd_chat_member')||'null');if(saved&&members.some(m=>String(m.id)===String(saved.id))){me=members.find(m=>String(m.id)===String(saved.id));showChat()}else showJoin()}catch(e){$('join').classList.add('show');$('chat').innerHTML='<div class="empty">❌ Mitglieder konnten nicht geladen werden.</div>'}}$('joinBtn').addEventListener('click',()=>{const m=members.find(x=>String(x.id)===$('member').value);if(!m)return;me={id:m.id,name:m.name};saveMe();showChat()});$('changeBtn').addEventListener('click',()=>{localStorage.removeItem('cnd_chat_member');me=null;showJoin()});$('composer').addEventListener('submit',async e=>{e.preventDefault();const input=$('message'),text=input.value.trim();if(!text||!me)return;const btn=e.target.querySelector('button');btn.disabled=true;try{const r=await fetch(U+'/rest/v1/clan_chat_messages',{method:'POST',headers:{...H,Prefer:'return=minimal'},body:JSON.stringify({member_id:me.id,member_name:me.name,message:text})});if(!r.ok)throw Error('Nachricht konnte nicht gesendet werden');input.value='';await loadMessages()}catch(err){alert(err.message)}finally{btn.disabled=false;input.focus()}});loadMembers();setInterval(()=>{if(me)loadMessages()},5000);</script></body></html>

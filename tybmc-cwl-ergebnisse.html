<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TYBMC – CWL Ergebnisse</title><style>:root{--gold:#ffc43d;--gold2:#ff9f1c;--text:#f8f5ff;--muted:#aaa1bb;--line:#ffffff18}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% -8%,#4b286d 0,#21142f 28%,#090611 68%);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif}.wrap{max-width:1000px;margin:auto;padding:22px 16px 80px}.back{color:var(--gold);text-decoration:none;font-weight:900}.hero{text-align:center;margin:18px 0 25px;padding:25px;border:1px solid #ffc43d35;border-radius:24px;background:linear-gradient(145deg,#241531,#100c18)}h1{font-size:clamp(34px,6vw,52px);color:var(--gold);margin:10px 0 5px}.hero p{color:var(--muted)}.card{border:1px solid var(--line);border-radius:18px;background:linear-gradient(145deg,#1b1428,#100c18);overflow:hidden}.row{display:grid;grid-template-columns:70px 1fr 120px 120px 120px 120px;gap:10px;align-items:center;padding:16px;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.round{color:var(--gold);font-weight:900}.opponent{font-weight:800;font-size:17px}.input-group label{display:block;font-size:11px;color:var(--muted);font-weight:700;margin-bottom:4px}.input-group input{width:100%;padding:9px;border-radius:9px;border:1px solid #ffffff22;background:#09070d;color:var(--text);font:inherit}.save{display:block;width:100%;margin-top:18px;border:0;border-radius:12px;padding:15px;background:linear-gradient(135deg,var(--gold),var(--gold2));color:#171122;font-weight:900;font-size:16px;cursor:pointer}.saved{text-align:center;color:var(--gold);font-weight:800;min-height:25px;margin-top:10px}.note{margin-top:16px;color:var(--muted);font-size:13px;text-align:center}@media(max-width:850px){.row{grid-template-columns:60px 1fr 1fr 1fr}}@media(max-width:600px){.row{grid-template-columns:60px 1fr}.input-group{grid-column:auto!important}.opponent{font-size:16px}}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><main class="wrap"><a class="back" href="tybmc-cwl.html">← Zurück zur TYBMC-CWL</a><section class="hero"><h1>TYBMC – CWL-Ergebnisse</h1><p>7 Gegner · Sterne und Prozente pro Runde eintragen</p></section><section class="card" id="rows"></section><button class="save" id="save">💾 Sterne &amp; Prozente speichern</button><div class="saved" id="saved"></div><div class="note">CWL-Regel: Jeder Spieler hat pro Krieg genau einen Angriff.<br>Die Ergebnisse werden zentral gespeichert und sind auf allen Geräten verfügbar.</div></main><script>const SB_URL='https://jvgqvtnqncelbhuordzy.supabase.co',SB_KEY='sb_publishable_4PusmhJVMm0b3Bm-2Y-FPQ__tnZZzZO',db=supabase.createClient(SB_URL,SB_KEY),clan='tybmc',opponents=['DANGER TIGER','skylargyi','Robo Coc','kings Landing','CORPES CLASHER','2017','tanRininkiRbaci'];const rows=document.getElementById('rows');opponents.forEach((name,i)=>{const r=i+1;rows.insertAdjacentHTML('beforeend',`<div class="row"><div class="round">Runde ${r}</div><div class="opponent">${name}</div><div class="input-group"><label>Eigene Sterne</label><input type="number" min="0" max="100" step="1" data-f="own_stars" data-r="${r}"></div><div class="input-group"><label>Gegnersterne</label><input type="number" min="0" max="100" step="1" data-f="opponent_stars" data-r="${r}"></div><div class="input-group"><label>Eigene %</label><input type="number" min="0" max="100" step="0.01" data-f="own_pct" data-r="${r}"></div><div class="input-group"><label>Gegner %</label><input type="number" min="0" max="100" step="0.01" data-f="opponent_pct" data-r="${r}"></div></div>`)});const inputs=[...document.querySelectorAll('input[data-r]')];async function load(){const saved=document.getElementById('saved');const{data,error}=await db.from('cwl_results').select('round,opponent,own_stars,opponent_stars,own_pct,opponent_pct').eq('clan',clan);if(error){saved.textContent='⚠️ Laden fehlgeschlagen: '+(error.message||'Unbekannter Fehler');return}data.sort((a,b)=>a.round-b.round).forEach(d=>inputs.filter(i=>i.dataset.r==d.round).forEach(i=>i.value=d[i.dataset.f]??''));saved.textContent=data.length?'✅ Zentrale Daten geladen':'ℹ️ Noch keine Ergebnisse gespeichert';if(data.length)setTimeout(()=>saved.textContent='',2000)}document.getElementById('save').onclick=async()=>{const saved=document.getElementById('saved');const data=[];for(let r=1;r<=7;r++){const row={clan,round:r,opponent:opponents[r-1]};inputs.filter(i=>i.dataset.r==r).forEach(i=>row[i.dataset.f]=i.value===''?null:Number(i.value));data.push(row)}const{error}=await db.from('cwl_results').upsert(data,{onConflict:'clan,round'});saved.textContent=error?'⚠️ Speichern fehlgeschlagen: '+(error.message||'Unbekannter Fehler'):'✅ Zentral gespeichert';if(!error)setTimeout(()=>saved.textContent='',2500)};load();</script></body></html>

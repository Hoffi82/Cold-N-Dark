<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090611"><title>TYBMC – Spielerprofil</title><style>
:root{--gold:#ffc43d;--text:#f8f5ff;--muted:#aaa1bb;--line:#ffffff18}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% -8%,#4b286d 0,#21142f 25%,#090611 63%);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif}.nav{max-width:1100px;margin:auto;padding:12px 18px;display:flex;align-items:center;gap:14px;border-bottom:1px solid var(--line)}.logo{width:52px;height:52px;border:2px solid var(--gold);border-radius:14px}.brand{flex:1}.brand strong{display:block;letter-spacing:2px}.brand small{color:var(--gold);font-weight:900}.back{color:var(--gold);text-decoration:none;font-weight:900}main{max-width:1100px;margin:auto;padding:30px 18px 70px}.hero,.card{border:1px solid var(--line);border-radius:20px;background:linear-gradient(145deg,#1b1428ee,#100c18e8);padding:22px;box-shadow:0 14px 35px #0007;margin-bottom:16px}.hero{text-align:center;border-color:#ffc43d35}.eyebrow{color:var(--gold);font-size:11px;font-weight:900;letter-spacing:1px}.avatar{width:86px;height:86px;margin:14px auto;border-radius:22px;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#59327f,#1c132b 70%);border:1px solid #a66cff44;font-size:25px;font-weight:1000}.hero h1{margin:4px 0;font-size:42px}.sub{color:var(--muted)}.badge{display:inline-block;margin-top:12px;padding:7px 12px;border-radius:999px;color:var(--gold);border:1px solid #ffc43d55;background:#ffc43d0d;font-weight:900}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.stat{text-align:center;padding:16px 6px;border:1px solid var(--line);border-radius:13px;background:#ffffff06}.stat b{display:block;color:var(--gold);font-size:24px}.stat span{font-size:10px;color:var(--muted);font-weight:800}.info{color:var(--muted);line-height:1.6}.empty{text-align:center;color:var(--muted);padding:30px}@media(max-width:700px){.stats{grid-template-columns:1fr}.hero h1{font-size:34px}}</style></head><body><div class="nav"><img class="logo" src="tybmc-logo.svg" alt="TYBMC Wappen"><div class="brand"><strong>TYBMC</strong><small>SPIELERPROFIL</small></div><a class="back" href="tybmc.html">← TYBMC-Kader</a></div><main><section id="profile" class="hero"><div class="empty">⏳ Profil wird geladen …</div></section><section class="card"><h2>⚔️ Kriegsstatistik</h2><div class="stats"><div class="stat"><b id="wars">0</b><span>KRIEGE</span></div><div class="stat"><b id="attacks">0</b><span>ANGRIFFE</span></div><div class="stat"><b id="stars">0</b><span>STERNE</span></div></div><p class="info">Die persönlichen TYBMC-Kriegsdaten werden aus der Kriegsverwaltung übernommen, sobald der Spieler eindeutig mit einem Kriegsteilnehmer verknüpft ist.</p></section></main><script src="tybmc-members-data.js"></script><script>
const roles={leader:'Anführer',coLeader:'Vize-Anführer',admin:'Ältester',member:'Mitglied'},icons={leader:'🔥',coLeader:'🛡️',admin:'👑',member:'⚔️'};const q=new URLSearchParams(location.search),name=q.get('name');const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const members=window.TYBMC_MEMBERS||[];const m=members.find(x=>x.name===name);const box=document.getElementById('profile');if(!m){box.innerHTML='<div class="empty">❌ Spieler nicht gefunden.<br><br><a class="back" href="tybmc.html">← Zurück zum TYBMC-Kader</a></div>'}else{const initials=m.name.split(/\s+/).map(x=>x[0]).join('').slice(0,2).toUpperCase();box.innerHTML='<div class="eyebrow">👤 SPIELERPROFIL • TYBMC</div><div class="avatar">'+esc(initials)+'</div><h1>'+esc(m.name)+'</h1><div class="sub">'+esc(roles[m.role]||'Mitglied')+' • TYBMC • Gold Liga 3</div><span class="badge">'+(icons[m.role]||'⚔️')+' '+esc(roles[m.role]||'Mitglied')+'</span>'}
</script></body></html>

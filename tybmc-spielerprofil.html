<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090611"><title>TYBMC – Spielerprofil</title><style>:root{--gold:#ffc43d;--text:#f8f5ff;--muted:#aaa1bb;--line:#ffffff18;--green:#31e36b}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% -8%,#4b286d 0,#21142f 25%,#090611 63%);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif}.nav{max-width:1100px;margin:auto;padding:12px 18px;display:flex;align-items:center;gap:14px;border-bottom:1px solid var(--line)}.logo{width:52px;height:52px;border:2px solid var(--gold);border-radius:14px}.brand{flex:1}.brand strong{display:block;letter-spacing:2px}.brand small{color:var(--gold);font-weight:900}.back{color:var(--gold);text-decoration:none;font-weight:900}main{max-width:1100px;margin:auto;padding:30px 18px 70px}.hero,.card{border:1px solid var(--line);border-radius:20px;background:linear-gradient(145deg,#1b1428ee,#100c18e8);padding:22px;box-shadow:0 14px 35px #0007;margin-bottom:16px}.hero{text-align:center;border-color:#ffc43d35}.eyebrow{color:var(--gold);font-size:11px;font-weight:900;letter-spacing:1px}.avatar{width:86px;height:86px;margin:14px auto;border-radius:22px;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#59327f,#1c132b 70%);border:1px solid #a66cff44;font-size:25px;font-weight:1000}.hero h1{margin:4px 0;font-size:42px}.sub{color:var(--muted)}.badge{display:inline-block;margin-top:12px;padding:7px 12px;border-radius:999px;color:var(--gold);border:1px solid #ffc43d55;background:#ffc43d0d;font-weight:900}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.stat{text-align:center;padding:16px 6px;border:1px solid var(--line);border-radius:13px;background:#ffffff06}.stat b{display:block;color:var(--gold);font-size:24px}.stat span{font-size:10px;color:var(--muted);font-weight:800}.info{color:var(--muted);line-height:1.6}.war{border-top:1px solid var(--line);padding:13px 0}.war:first-child{border-top:0}.war-head{display:flex;justify-content:space-between;gap:10px}.war-name{font-weight:900;color:var(--gold)}.war-score{font-weight:900}.war-meta{color:var(--muted);font-size:12px;margin-top:4px}.empty{text-align:center;color:var(--muted);padding:30px}@media(max-width:700px){.stats{grid-template-columns:1fr}.hero h1{font-size:34px}.war-head{flex-direction:column}}</style></head><body><div class="nav"><img class="logo" src="tybmc-logo.svg" alt="TYBMC Wappen"><div class="brand"><strong>TYBMC</strong><small>SPIELERPROFIL</small></div><a class="back" href="tybmc.html">← TYBMC-Kader</a></div><main><section id="profile" class="hero"><div class="empty">⏳ Profil wird geladen …</div></section><section class="card"><h2>⚔️ Kriegsstatistik</h2><div class="stats"><div class="stat"><b id="wars">0</b><span>KRIEGE</span></div><div class="stat"><b id="attacks">0</b><span>ANGRIFFE</span></div><div class="stat"><b id="stars">0</b><span>STERNE</span></div></div><p class="info">Die persönlichen TYBMC-Kriegsdaten werden direkt aus der Kriegsverwaltung übernommen.</p></section><section class="card"><h2>📜 Letzte Kriege</h2><div id="lastWars" class="empty">⏳ Kriege werden geladen …</div></section></main><script src="tybmc-members-data.js"></script><script>const SUPABASE_URL='https://jvgqvtnqncelbhuordzy.supabase.co',SUPABASE_KEY='sb_publishable_4PusmhJVMm0b3Bm-2Y-FPQ__tnZZzZO',H={apikey:SUPABASE_KEY,Authorization:'Bearer '+SUPABASE_KEY};const roles={leader:'Anführer',coLeader:'Vize-Anführer',admin:'Ältester',member:'Mitglied'},icons={leader:'🔥',coLeader:'🛡️',admin:'👑',member:'⚔️'};const q=new URLSearchParams(location.search),name=q.get('name'),members=window.TYBMC_MEMBERS||[];const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const n=v=>Number(v||0);async function api(url){const r=await fetch(url,{headers:H});if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}function initials(x){return x.split(/\s+/).map(a=>a[0]).join('').slice(0,2).toUpperCase()}async function load(){const box=document.getElementById('profile'),last=document.getElementById('lastWars');const m=members.find(x=>x.name===name);if(!m){box.innerHTML='<div class="empty">❌ Spieler nicht gefunden.<br><br><a class="back" href="tybmc.html">← Zurück zum TYBMC-Kader</a></div>';last.innerHTML='';return}const role=roles[m.role]||'Mitglied';box.innerHTML='<div class="eyebrow">👤 SPIELERPROFIL • TYBMC</div><div class="avatar">'+esc(initials(m.name))+'</div><h1>'+esc(m.name)+'</h1><div class="sub">'+esc(role)+' • TYBMC • Gold Liga 3</div><span class="badge">'+(icons[m.role]||'⚔️')+' '+esc(role)+'</span>';try{const [wars,rows]=await Promise.all([api(SUPABASE_URL+'/rest/v1/tybmc_wars?select=id,opponent,war_size,our_stars,enemy_stars,our_destruction,enemy_destruction,status,created_at&order=created_at.desc'),api(SUPABASE_URL+'/rest/v1/tybmc_war_members?select=war_id,member_id,map_position,attack1_stars,attack1_destruction,attack2_stars,attack2_destruction&order=id.asc')]);const memberId=members.findIndex(x=>x.name===m.name)+1;const mine=rows.filter(r=>Number(r.member_id)===memberId);const byWar=new Map();mine.forEach(r=>{if(!byWar.has(String(r.war_id)))byWar.set(String(r.war_id),r)});const mineWars=wars.filter(w=>byWar.has(String(w.id)));let attacks=0,stars=0;mine.forEach(r=>{const a=(n(r.attack1_stars)>0||n(r.attack1_destruction)>0?1:0)+(n(r.attack2_stars)>0||n(r.attack2_destruction)>0?1:0);attacks+=a;stars+=n(r.attack1_stars)+n(r.attack2_stars)});document.getElementById('wars').textContent=mineWars.length;document.getElementById('attacks').textContent=attacks;document.getElementById('stars').textContent=stars;if(!mineWars.length){last.innerHTML='<div class="empty">📜 Für diesen Spieler sind noch keine Kriege hinterlegt.</div>';return}last.className='';last.innerHTML=mineWars.slice(0,3).map(w=>{const r=byWar.get(String(w.id));const a=(n(r.attack1_stars)>0||n(r.attack1_destruction)>0?1:0)+(n(r.attack2_stars)>0||n(r.attack2_destruction)>0?1:0);const s=n(r.attack1_stars)+n(r.attack2_stars);return '<div class="war"><div class="war-head"><div class="war-name">⚔️ '+esc(w.opponent||'Gegner')+'</div><div class="war-score">⭐ '+s+' Sterne</div></div><div class="war-meta">'+esc(w.war_size||'')+' • '+a+' Angriff'+(a===1?'':'e')+' • '+esc(w.status||'finished')+'</div></div>'}).join('')}catch(e){last.innerHTML='<div class="empty">⚠️ Kriegsdaten konnten nicht geladen werden.</div>';console.error(e)}}load();</script></body></html>

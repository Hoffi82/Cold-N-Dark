<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090611">
<title>Cold N' Dark – Mitglieder</title>
<style>
:root{--bg:#08050f;--panel:#151020;--panel2:#1e1530;--gold:#ffc43d;--gold2:#ff9718;--purple:#a66cff;--text:#f8f5ff;--muted:#aaa1bb;--line:#ffffff18}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% -10%,#4b286d 0,#21142f 28%,#090611 68%);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;padding-bottom:82px}body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 10% 25%,#ffc43d0a,transparent 25%),radial-gradient(circle at 90% 60%,#8d5cff0b,transparent 28%)}
.bar{position:sticky;top:0;z-index:20;background:#08050fee;backdrop-filter:blur(18px);border-bottom:1px solid var(--line);padding:10px 13px}.barin{max-width:900px;margin:auto;display:flex;align-items:center;gap:10px}.logo{width:46px;height:46px;object-fit:cover;border-radius:13px;border:2px solid var(--gold);box-shadow:0 0 20px #ffc43d22}.brand{flex:1}.brand strong{display:block;font-size:15px;letter-spacing:1.6px}.brand small{display:block;color:var(--gold);font-size:9px;font-weight:900;letter-spacing:.7px}.back{color:var(--gold);text-decoration:none;font-size:11px;font-weight:900;border:1px solid #ffc43d44;border-radius:10px;padding:8px 10px}
main{max-width:900px;margin:auto;padding:16px 12px}.hero{position:relative;overflow:hidden;border:1px solid #ffc43d28;border-radius:22px;background:linear-gradient(135deg,#241531ee,#100c18ee);padding:20px;box-shadow:0 18px 45px #0007}.hero-top{display:flex;align-items:center;gap:13px}.hero-logo{width:62px;height:62px;object-fit:contain;filter:drop-shadow(0 0 18px #a66cff44)}.eyebrow{display:inline-flex;color:var(--gold);font-size:9px;font-weight:900;letter-spacing:1px;border:1px solid #ffc43d44;background:#ffc43d0b;border-radius:999px;padding:5px 8px}.hero h1{margin:8px 0 3px;font-size:31px;line-height:1;letter-spacing:-.8px}.hero h1 span{color:var(--gold)}.hero p{margin:0;color:var(--muted);font-size:11px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:16px}.stat{border:1px solid var(--line);background:#ffffff06;border-radius:13px;text-align:center;padding:9px 3px}.stat b{display:block;color:var(--gold);font-size:19px}.stat span{display:block;color:var(--muted);font-size:8px;font-weight:800;margin-top:2px}
.tools{display:grid;grid-template-columns:1fr auto;gap:7px;margin:12px 0 8px}.search{width:100%;border:1px solid var(--line);border-radius:13px;background:#110d19;color:var(--text);padding:11px 12px;font:inherit;font-size:13px;outline:none}.search:focus{border-color:#ffc43d66}.count{display:grid;place-items:center;padding:0 12px;border:1px solid #ffc43d30;border-radius:13px;background:#ffc43d08;color:var(--gold);font-size:10px;font-weight:900;white-space:nowrap}.filters{display:flex;gap:6px;overflow:auto;padding-bottom:8px}.filter{border:1px solid var(--line);background:#ffffff05;color:var(--muted);border-radius:999px;padding:7px 10px;font-size:9px;font-weight:900;white-space:nowrap}.filter.active{border-color:#ffc43d66;color:var(--gold);background:#ffc43d0d}.members{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.member{position:relative;overflow:hidden;display:grid;grid-template-columns:38px 1fr auto;align-items:center;gap:8px;padding:10px;border:1px solid var(--line);border-radius:15px;background:linear-gradient(145deg,#1b1428ee,#100c18e8);box-shadow:0 7px 20px #0005}.member:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(var(--gold),var(--gold2))}.avatar{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#59327f,#1c132b 70%);border:1px solid #a66cff2b;color:#fff;font-weight:1000;font-size:11px}.info strong{display:block;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.info small{display:block;color:var(--muted);font-size:8px;margin-top:2px}.meta{text-align:right}.th{display:inline-block;color:#fff;background:linear-gradient(135deg,#7b35ff,#402080);border-radius:7px;padding:4px 6px;font-size:9px;font-weight:1000}.role{display:block;color:var(--gold);font-size:7px;margin-top:3px;font-weight:900}.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:28px}.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#08050ff5;backdrop-filter:blur(18px);border-top:1px solid var(--line);padding:7px 7px calc(7px + env(safe-area-inset-bottom))}.navin{max-width:900px;margin:auto;display:grid;grid-template-columns:repeat(5,1fr);gap:3px}.nav a{text-align:center;text-decoration:none;color:var(--muted);font-size:8px;font-weight:900;padding:4px 2px;border-radius:10px}.nav a.active,.nav a:hover{color:var(--gold);background:#ffc43d0d}.nav i{display:block;font-style:normal;font-size:17px;line-height:19px}@media(max-width:520px){.members{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}.hero h1{font-size:29px}.tools{grid-template-columns:1fr}.count{padding:9px}}
</style>
</head>
<body>
<header class="bar"><div class="barin"><img class="logo" src="Wappen.png" alt="Wappen"><div class="brand"><strong>COLD N' DARK</strong><small>CLAN-APP • MITGLIEDER</small></div><a class="back" href="app.html">← Start</a></div></header>
<main>
<section class="hero"><div class="hero-top"><img class="hero-logo" src="Clan logo.png" alt="Clan Logo"><div><span class="eyebrow">👥 BESTÄTIGTER KADER</span><h1>Unsere <span>Mitglieder</span></h1><p>Der feste 30er-Kader auf einen Blick.</p></div></div><div class="stats"><div class="stat"><b id="total">30</b><span>MITGLIEDER</span></div><div class="stat"><b>26</b><span>CLAN-LEVEL</span></div><div class="stat"><b id="th18">18</b><span>TH18</span></div><div class="stat"><b id="th17">7</b><span>TH17</span></div></div></section>
<div class="tools"><input id="search" class="search" type="search" placeholder="🔎 Mitglied suchen …"><div id="count" class="count">30 / 30</div></div>
<div class="filters"><button class="filter active" data-filter="all">Alle</button><button class="filter" data-filter="admin">Älteste</button><button class="filter" data-filter="coLeader">Vize</button><button class="filter" data-filter="leader">Anführer</button><button class="filter" data-filter="member">Mitglieder</button><button class="filter" data-filter="th18">TH18</button><button class="filter" data-filter="th17">TH17</button><button class="filter" data-filter="th16">TH16</button><button class="filter" data-filter="th15">TH15</button></div>
<section id="members" class="members"></section>
</main>
<nav class="nav"><div class="navin"><a href="app.html"><i>🏠</i>Start</a><a class="active" href="mitglieder-app.html"><i>👥</i>Mitglieder</a><a href="krieg-app.html"><i>⚔️</i>Krieg</a><a href="cwl-app.html"><i>🏆</i>CWL</a><a href="mehr-app.html"><i>☰</i>Mehr</a></div></nav>
<script src="members-data.js"></script>
<script>
const roles={leader:'Anführer',coLeader:'Vize',admin:'Ältester',member:'Mitglied'};let active='all';const members=window.COLD_N_DARK_MEMBERS||[];const $=id=>document.getElementById(id);function initials(n){return n.split(/\s+/).map(x=>x[0]).join('').slice(0,2).toUpperCase()}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function ok(m){if(active==='all')return true;if(active.startsWith('th'))return Number(m.townHallLevel)===Number(active.slice(2));return m.role===active}function render(){const term=$('search').value.toLowerCase().trim(),list=members.filter(m=>(!term||m.name.toLowerCase().includes(term))&&ok(m));$('count').textContent=list.length+' / '+members.length;$('total').textContent=members.length;$('members').innerHTML=list.length?list.map((m)=>`<article class="member"><span class="avatar">${esc(initials(m.name))}</span><div class="info"><strong>${esc(m.name)}</strong><small>${esc(roles[m.role]||'Mitglied')} • bestätigter Kader</small></div><div class="meta"><span class="th">TH ${esc(m.townHallLevel||'?')}</span><span class="role">${esc(roles[m.role]||'MITGLIED').toUpperCase()}</span></div></article>`).join(''):'<div class="empty">🔎 Keine Mitglieder gefunden.</div>'}$('th18').textContent=members.filter(m=>m.townHallLevel===18).length;$('th17').textContent=members.filter(m=>m.townHallLevel===17).length}$('search').addEventListener('input',render);document.querySelectorAll('.filter').forEach(b=>b.addEventListener('click',()=>{active=b.dataset.filter;document.querySelectorAll('.filter').forEach(x=>x.classList.toggle('active',x===b));render()}));render();
</script>
</body></html>

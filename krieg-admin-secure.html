<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cold N' Dark – Sichere Kriegsverwaltung</title><style>body{margin:0;background:radial-gradient(circle at 50% 0,#4b2158,#0b080e 65%);color:#fffaf0;font-family:Arial,sans-serif;padding:14px}main{max-width:900px;margin:auto}.card{background:#171122ee;border:2px solid #f4b82e;border-radius:18px;padding:18px;margin-bottom:16px}h1,h2{color:#ffd45b;margin-top:0}.sub{color:#b9afc0;font-size:14px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}button,select,input{font:inherit}button{padding:11px 14px;border-radius:11px;border:2px solid #8b6324;background:#24152e;color:#ffd45b;font-weight:900;cursor:pointer}button.primary{background:linear-gradient(135deg,#ffc43d,#ff9f1c);color:#171122}.war-select{width:100%;padding:12px;border-radius:11px;border:1px solid #55445f;background:#0c0911;color:#fff}.status{padding:11px;border-radius:10px;background:#09200f;color:#31e36b;font-weight:bold;margin:12px 0}.count{color:#ffd45b;font-weight:900}.member{border:1px solid #ffffff20;border-radius:14px;background:#0c0911;margin:9px 0;overflow:hidden}.head{display:grid;grid-template-columns:42px 1fr auto;align-items:center;gap:8px;padding:12px}.head input{width:22px;height:22px}.name{font-weight:900;font-size:16px}.role{color:#b9afc0;font-size:12px}.attacks{display:grid;grid-template-columns:1fr 1fr;gap:9px;padding:0 12px 12px}.attack{border:1px solid #ffffff20;border-radius:11px;padding:10px;background:#17131d}.attack b{display:block;color:#ffd45b;margin-bottom:7px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}.grid input{width:100%;box-sizing:border-box;padding:9px;border-radius:8px;border:1px solid #55445f;background:#08070b;color:white}.used{display:flex;gap:6px;align-items:center;font-size:12px;margin-bottom:7px}.save{margin-top:9px;width:100%}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.sum{padding:11px;border:1px solid #ffffff20;border-radius:11px;background:#0b0910;text-align:center}.sum b{display:block;color:#ffd45b;font-size:20px}.sum span{color:#9e94aa;font-size:11px}.msg{font-weight:900}.error{color:#ff7777}.ok{color:#31e36b}@media(max-width:650px){.attacks{grid-template-columns:1fr}.summary{grid-template-columns:1fr 1fr}}
</style></head><body><main><div class="card"><h1>⚔️ Sichere Kriegsverwaltung</h1><p class="sub">Diese Verwaltung verwendet ausschließlich die geschützte Admin-Session.</p><select id="war" class="war-select"></select><div id="status" class="status">⏳ Laden …</div><div id="info"></div></div><div class="card"><h2>👥 Kriegsteilnehmer</h2><div class="toolbar"><button onclick="all(true)">☑️ Alle</button><button onclick="all(false)">⬜ Keine</button><button class="primary" onclick="saveParticipants()">💾 Teilnehmer speichern</button></div><div id="count" class="count">0 ausgewählt</div><div id="members">⏳ …</div><div id="msg" class="msg"></div></div><div class="card"><h2>📊 Übersicht</h2><div class="summary"><div class="sum"><b id="players">0</b><span>Teilnehmer</span></div><div class="sum"><b id="attacks">0</b><span>Angriffe</span></div><div class="sum"><b id="stars">0</b><span>Sterne</span></div><div class="sum"><b id="open">0</b><span>offen</span></div></div></div><div class="toolbar"><a href="krieg.html" style="color:#ffd45b">⚔️ Kriegsseite</a><a href="admin.html" style="color:#ffd45b">🔐 Admin</a></div></main><script>const API='/api/manage-war';let data={wars:[],members:[],clanMembers:[]},war=null;const $=id=>document.getElementById(id),n=x=>Number(x||0);async function api(method='GET',body){const r=await fetch(API,{method,credentials:'same-origin',headers:{'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined,cache:'no-store'});const j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'Anfrage fehlgeschlagen');return j}async function load(){try{data=await api();const s=$('war');s.innerHTML=data.wars.map(w=>`<option value="${w.id}">${esc(w.opponent||'Gegner')} • ${esc(w.war_size||'25 vs. 25')} • ${fmt(w.created_at)}</option>`).join('');s.onchange=render;war=data.wars[0];if(war)s.value=war.id;render()}catch(e){$('status').textContent='❌ '+e.message}}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function fmt(v){return v?new Date(v).toLocaleDateString('de-DE'):''}function rows(){return data.members.filter(r=>String(r.war_id)===String(war?.id))}function render(){war=data.wars.find(w=>String(w.id)===String($('war').value))||war;if(!war){$('status').textContent='⚠️ Kein Krieg vorhanden';$('members').innerHTML='';return}const rs=rows(),by=new Map(rs.map(r=>[String(r.member_id),r]));$('status').textContent=war.status==='active'?'🟢 AKTIVER KRIEG':'📜 VERGANGENER KRIEG';$('info').innerHTML='<b>'+esc(war.opponent||'Gegner')+'</b> • '+esc(war.war_size||'25 vs. 25')+' • War-ID '+esc(war.id);$('members').innerHTML=data.clanMembers.map(m=>{const r=by.get(String(m.id));return `<div class="member"><div class="head"><input class="pick" data-id="${esc(m.id)}" type="checkbox" ${r?'checked':''} onchange="count()"><div><div class="name">${esc(m.name)}</div><div class="role">${esc(m.role||'Mitglied')}</div></div><span>${r?'⚔️':''}</span></div>${r?editor(r):''}</div>`}).join('');count();summary(rs)}function editor(r){return `<div class="attacks"><div class="attack"><b>⚔️ Angriff 1</b><label class="used"><input id="u1-${r.id}" type="checkbox" ${r.attack1_used?'checked':''}> gemacht</label><div class="grid"><label>⭐ Sterne<input id="s1-${r.id}" type="number" min="0" max="3" value="${n(r.attack1_stars)}"></label><label>💥 %<input id="d1-${r.id}" type="number" min="0" max="100" step="0.1" value="${n(r.attack1_destruction)}"></label></div></div><div class="attack"><b>⚔️ Angriff 2</b><label class="used"><input id="u2-${r.id}" type="checkbox" ${r.attack2_used?'checked':''}> gemacht</label><div class="grid"><label>⭐ Sterne<input id="s2-${r.id}" type="number" min="0" max="3" value="${n(r.attack2_stars)}"></label><label>💥 %<input id="d2-${r.id}" type="number" min="0" max="100" step="0.1" value="${n(r.attack2_destruction)}"></label></div></div><button class="save" onclick="saveAttack(${r.id})">💾 Angriffe speichern</button></div>`}function count(){$('count').textContent=document.querySelectorAll('.pick:checked').length+' ausgewählt'}function all(v){document.querySelectorAll('.pick').forEach(x=>x.checked=v);count()}async function saveParticipants(){try{const wanted=[...document.querySelectorAll('.pick:checked')].map(x=>x.dataset.id),current=rows();for(const r of current)if(!wanted.includes(String(r.member_id)))await api('DELETE',{table:'clan_war_members',id:r.id});const existing=new Set(current.map(r=>String(r.member_id)));for(const id of wanted)if(!existing.has(String(id)))await api('POST',{table:'clan_war_members',data:{war_id:war.id,member_id:id,attacks:0,stars:0,destruction:0,attack1_used:false,attack1_stars:0,attack1_destruction:0,attack2_used:false,attack2_stars:0,attack2_destruction:0}});data=await api();render();note('✅ Teilnehmer gespeichert','ok')}catch(e){note('❌ '+e.message,'error')}}async function saveAttack(id){const u1=$('u1-'+id).checked,u2=$('u2-'+id).checked,s1=Math.min(3,Math.max(0,n($('s1-'+id).value))),s2=Math.min(3,Math.max(0,n($('s2-'+id).value))),d1=Math.min(100,Math.max(0,n($('d1-'+id).value))),d2=Math.min(100,Math.max(0,n($('d2-'+id).value)));try{await api('PATCH',{table:'clan_war_members',id,data:{attack1_used:u1,attack1_stars:u1?s1:0,attack1_destruction:u1?d1:0,attack2_used:u2,attack2_stars:u2?s2:0,attack2_destruction:u2?d2:0,attacks:(u1?1:0)+(u2?1:0),stars:(u1?s1:0)+(u2?s2:0),destruction:(u1?d1:0)+(u2?d2:0)}});data=await api();render();note('✅ Angriffe gespeichert','ok')}catch(e){note('❌ '+e.message,'error')}}function summary(rs){let a=0,s=0;rs.forEach(r=>{a+=n(r.attacks);s+=n(r.stars)});$('players').textContent=rs.length;$('attacks').textContent=a;$('stars').textContent=s;$('open').textContent=Math.max(0,rs.length*2-a)}function note(t,c){$('msg').className='msg '+c;$('msg').textContent=t}load();</script></body></html>

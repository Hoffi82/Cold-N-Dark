<!doctype html>
<html lang="de">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#09070b"><title>Cold N' Dark – Kriegsbericht</title><style>:root{--bg:#09070d;--panel:#171122;--gold:#ffc43d;--gold2:#ffe07a;--text:#f7f4ff;--muted:#b9b2c9;--line:#ffffff1f;--green:#31e36b;--red:#ef5555}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,#302044,#09070d 62%);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif}header{background:#08060df2;border-bottom:1px solid var(--line);padding:14px 18px}.nav,main{max-width:1000px;margin:auto}.nav{display:flex;align-items:center;gap:14px}.logo{width:52px;height:52px;object-fit:cover;border-radius:14px;border:2px solid var(--gold)}.brand{flex:1}.brand strong{display:block;letter-spacing:2px}.brand small{color:var(--gold);font-weight:900}.back{color:var(--gold);font-weight:900;text-decoration:none}main{padding:28px 18px 70px}.hero,.card{border:1px solid var(--line);border-radius:18px;background:linear-gradient(145deg,#1b1225,#0d0a11);padding:20px;margin-bottom:16px;box-shadow:0 14px 35px #0008}.hero{text-align:center;border-color:#ffc43d44}.eyebrow{color:var(--gold);font-size:11px;font-weight:900;letter-spacing:1px}.hero h1{margin:8px 0;font-size:clamp(32px,7vw,58px)}.sub{color:var(--muted)}.score{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;margin-top:18px}.clan{text-align:center;font-weight:1000}.clan b{display:block;font-size:15px}.big{font-size:42px;color:var(--gold2);font-weight:1000}.vs{color:var(--gold);font-weight:1000}.metrics{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:18px}.metric{text-align:center;padding:12px 6px;border:1px solid var(--line);border-radius:11px;background:#08080b}.metric b{display:block;color:var(--gold);font-size:22px}.metric span{font-size:10px;color:var(--muted)}.win{color:var(--green)}.loss{color:var(--red)}.draw{color:var(--gold2)}.onestar{color:#ff7777}.table-wrap{overflow-x:auto}.players{width:100%;border-collapse:collapse;min-width:650px}.players th,.players td{padding:11px 9px;border-bottom:1px solid var(--line);text-align:center}.players th{color:#8f879b;font-size:10px;text-transform:uppercase}.players th:first-child,.players td:first-child{text-align:left}.players tr:last-child td{border-bottom:0}.empty{text-align:center;color:var(--muted);padding:28px}.note{font-size:12px;color:var(--muted);margin:10px 0 0}@media(max-width:650px){.metrics{grid-template-columns:repeat(2,1fr)}.score{gap:6px}.big{font-size:32px}}</style></head>
<body><header><div class="nav"><img class="logo" src="Wappen.png" alt="Cold N' Dark Wappen"><div class="brand"><strong>COLD N' DARK</strong><small>AUTOMATISCHER KRIEGSBERICHT</small></div><a class="back" href="krieg.html">← Kriege</a></div></header><main><section id="report" class="hero"><div class="empty">⏳ Kriegsbericht wird geladen …</div></section><section class="card"><h2>🏅 Spielerleistungen</h2><div id="players"><div class="empty">Wird geladen …</div></div></section></main><script>const U='https://jvgqvtnqncelbhuordzy.supabase.co',K='sb_publishable_4PusmhJVMm0b3Bm-2Y-FPQ__tnZZzZO',H={apikey:K,Authorization:'Bearer '+K},p=new URLSearchParams(location.search),wanted=p.get('id');const n=v=>Number(v||0),esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));async function get(path){const r=await fetch(U+path,{headers:H});if(!r.ok)throw Error(await r.text());return r.json()}function one(r){return(n(r.attack1_used)&&n(r.attack1_stars)===1&&n(r.attack1_destruction)>=90)||(n(r.attack2_used)&&n(r.attack2_stars)===1&&n(r.attack2_destruction)>=90)}function result(w){const a=n(w.our_stars),b=n(w.enemy_stars);return a>b?'win':a<b?'loss':'draw'}function resultText(r){return r==='win'?'🏆 SIEG':r==='loss'?'❌ NIEDERLAGE':'🤝 UNENTSCHIEDEN'}async function load(){try{const wars=await get('/rest/v1/clan_wars?select=*&order=created_at.desc');if(!wars.length)throw Error('Noch kein Krieg vorhanden.');const w=wanted?wars.find(x=>String(x.id)===String(wanted)):wars.find(x=>String(x.status||'').toLowerCase()!=='active')||wars[0];if(!w)throw Error('Krieg nicht gefunden.');const rows=await get('/rest/v1/clan_war_members?select=*&war_id=eq.'+encodeURIComponent(w.id)+'&order=stars.desc,destruction.desc');const ids=[...new Set(rows.map(r=>r.member_id).filter(Boolean))];let members=[];if(ids.length)members=await get('/rest/v1/clan_members?select=id,name,town_hall_level&id=in.('+ids.join(',')+')');const mm=new Map(members.map(m=>[String(m.id),m]));const attacks=rows.reduce((a,r)=>a+n(r.attacks),0),stars=rows.reduce((a,r)=>a+n(r.stars),0),dest=rows.reduce((a,r)=>a+n(r.destruction),0),avg=attacks?dest/attacks:0,onestars=rows.filter(one).length,r=result(w),scoreOwn=n(w.our_stars),scoreEnemy=n(w.enemy_stars);document.getElementById('report').innerHTML='<div class="eyebrow">⚔️ KRIEGSBERICHT</div><h1>'+esc(w.opponent||'Gegner')+'</h1><div class="sub">'+esc(w.war_size||'25 vs. 25')+(w.created_at?' • '+new Date(w.created_at).toLocaleDateString('de-DE'):'')+'</div><div class="score"><div class="clan"><b>COLD N\' DARK</b><div class="big">'+scoreOwn+'</div></div><div class="vs">VS</div><div class="clan"><b>'+esc(w.opponent||'GEGNER')+'</b><div class="big">'+scoreEnemy+'</div></div></div><div class="metrics"><div class="metric"><b>'+attacks+'</b><span>ANGRIFFE</span></div><div class="metric"><b>'+stars+'</b><span>EIGENE STERNE</span></div><div class="metric"><b>'+avg.toFixed(1).replace('.',',')+'%</b><span>Ø ZERSTÖRUNG</span></div><div class="metric"><b class="onestar">'+onestars+'</b><span>🚨 ONESTARS</span></div><div class="metric"><b class="'+r+'">'+resultText(r)+'</b><span>ERGEBNIS</span></div></div>';document.getElementById('players').innerHTML=rows.length?'<div class="table-wrap"><table class="players"><thead><tr><th>Spieler</th><th>TH</th><th>Angriffe</th><th>Sterne</th><th>Ø Zerstörung</th><th>Onestar</th></tr></thead><tbody>'+rows.map(x=>{const m=mm.get(String(x.member_id))||{};const a=n(x.attacks),d=a?n(x.destruction)/a:0;return '<tr><td><b>'+esc(m.name||'Unbekannt')+'</b></td><td>'+esc(m.town_hall_level||'–')+'</td><td>'+a+'</td><td>⭐ '+n(x.stars)+'</td><td>'+d.toFixed(1).replace('.',',')+'%</td><td class="onestar">'+(one(x)?'🚨 JA':'–')+'</td></tr>'}).join('')+'</tbody></table></div><p class="note">🚨 Onestar = genau 1 ⭐ bei mindestens 90 % Zerstörung.</p>':'<div class="empty">Noch keine Spielerleistungen eingetragen.</div>'}catch(e){document.getElementById('report').innerHTML='<div class="empty">❌ '+esc(e.message)+'</div>';document.getElementById('players').innerHTML='<div class="empty">Keine Daten verfügbar.</div>';console.error(e)}}load();</script></body></html>

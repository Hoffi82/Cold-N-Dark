<!doctype html>
<html lang="de">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cold N' Dark – Kriegsverwaltung</title>
<style>
body{margin:0;background:radial-gradient(circle at 50% 0,#4b2158,#0b080e 65%);color:#fffaf0;font-family:Arial,sans-serif;padding:14px}main{max-width:900px;margin:auto}.card{background:#171122ee;border:2px solid #f4b82e;border-radius:18px;padding:18px;box-shadow:0 15px 40px #0009;margin-bottom:16px}h1,h2{color:#ffd45b;margin-top:0}.sub{color:#c8bdc7;font-size:14px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}button,a{padding:11px 14px;border-radius:11px;border:2px solid #8b6324;background:#24152e;color:#ffd45b;font-weight:900;text-decoration:none;cursor:pointer}button.primary{background:linear-gradient(135deg,#ffc43d,#ff9f1c);color:#171122}.status{padding:11px;border-radius:10px;background:#09200f;color:#31e36b;font-weight:bold;margin:12px 0}.count{color:#ffd45b;font-weight:900}.member{border:1px solid #ffffff20;border-radius:14px;background:#0c0911;margin:9px 0;overflow:hidden}.member-head{display:grid;grid-template-columns:42px 1fr auto;align-items:center;gap:8px;padding:12px}.member-head input{width:22px;height:22px}.member-name{font-weight:900;font-size:16px}.member-role{color:#9e94aa;font-size:11px}.attacks{display:grid;grid-template-columns:1fr 1fr;gap:9px;padding:0 12px 12px}.attack{border:1px solid #ffffff20;border-radius:11px;padding:10px;background:#17131d}.attack b{display:block;color:#ffd45b;margin-bottom:7px}.attack-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}.attack-grid input{width:100%;box-sizing:border-box;padding:9px;border-radius:8px;border:1px solid #55445f;background:#08070b;color:white}.attack-grid label{font-size:11px;color:#a99fb0}.used{display:flex;align-items:center;gap:6px;font-size:12px;margin-bottom:7px}.used input{width:18px;height:18px}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.sum{padding:11px;border:1px solid #ffffff20;border-radius:11px;background:#0b0910;text-align:center}.sum b{display:block;color:#ffd45b;font-size:20px}.sum span{color:#9e94aa;font-size:11px}.msg{margin-top:12px;font-weight:900}.error{color:#ff7777}.ok{color:#31e36b}@media(max-width:650px){.attacks{grid-template-columns:1fr}.summary{grid-template-columns:1fr 1fr}.member-head{grid-template-columns:38px 1fr auto}button,a{font-size:13px;padding:10px 11px}}
</style></head>
<body><main>
<div class="card"><h1>⚔️ Kriegsverwaltung</h1><p class="sub">Teilnehmer auswählen und anschließend Angriff 1 und Angriff 2 direkt vom Handy verwalten.</p><div id="warStatus" class="status">⏳ Lade Krieg …</div><div id="warInfo"></div></div>
<div class="card"><h2>👥 Kriegsteilnehmer</h2><div class="toolbar"><button onclick="selectAll()">☑️ Alle auswählen</button><button onclick="clearAll()">⬜ Auswahl löschen</button><button class="primary" onclick="saveParticipants()">💾 Teilnehmer speichern</button></div><div class="count" id="count">0 / 25 ausgewählt</div><div id="members">⏳ Mitglieder werden geladen …</div><div id="msg" class="msg"></div></div>
<div class="card"><h2>📊 Kriegsübersicht</h2><div class="summary"><div class="sum"><b id="sumPlayers">0</b><span>Teilnehmer</span></div><div class="sum"><b id="sumAttacks">0 / 0</b><span>Angriffe</span></div><div class="sum"><b id="sumStars">0</b><span>Sterne</span></div><div class="sum"><b id="sumOpen">0</b><span>Angriffe offen</span></div></div></div>
<div class="toolbar"><a href="krieg.html">⚔️ Kriegsseite</a><a href="index.html">🏠 Startseite</a></div>
</main>
<script>
const SUPABASE_URL='https://jvgqvtnqncelbhuordzy.supabase.co';const SUPABASE_KEY='sb_publishable_4PusmhJVMm0b3Bm-2Y-FPQ__tnZZzZO';const H={'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY,'Content-Type':'application/json','Prefer':'return=representation'};const W=SUPABASE_URL+'/rest/v1/clan_wars';const WM=SUPABASE_URL+'/rest/v1/clan_war_members';const CM=SUPABASE_URL+'/rest/v1/clan_members';let war=null,members=[],rows=[];
const $=id=>document.getElementById(id),n=v=>Number(v||0),esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
async function api(url,opt={}){let r=await fetch(url,{...opt,headers:{...H,...(opt.headers||{})}});if(!r.ok)throw new Error(await r.text());return r.status===204?null:r.json()}
async function load(){try{let [wars,cm,wm]=await Promise.all([api(W+'?select=*&status=eq.active&order=created_at.desc&limit=1'),api(CM+'?select=id,name,role&order=name.asc'),api(WM+'?select=*&order=id.asc')]);war=wars[0];members=cm;rows=wm;if(!war){$('warStatus').textContent='⚠️ Kein aktiver Krieg';$('members').innerHTML='<div class="sub">Aktuell läuft kein Krieg.</div>';return}$('warStatus').textContent='🟢 AKTIVER KRIEG';$('warInfo').innerHTML='<b>'+esc(war.opponent||'Gegner')+'</b> • '+esc(war.war_size||'25 vs. 25')+' • War-ID '+esc(war.id);render();}catch(e){console.error(e);$('warStatus').textContent='❌ Fehler beim Laden';$('members').innerHTML='<div class="error">'+esc(e.message)+'</div>'}}
function render(){let selected=rows.filter(r=>String(r.war_id)===String(war.id));$('count').textContent=selected.length+' / '+(war.war_size||'25')+' ausgewählt';let by=new Map(selected.map(r=>[String(r.member_id),r]));$('members').innerHTML=members.map(m=>{let r=by.get(String(m.id));return `<div class="member"><div class="member-head"><input type="checkbox" class="pick" data-id="${esc(m.id)}" ${r?'checked':''} onchange="updateCount()"><div><div class="member-name">${esc(m.name)}</div><div class="member-role">${esc(m.role||'Mitglied')}</div></div><span>${r?'⚔️':''}</span></div>${r?attackEditor(r):''}</div>`}).join('');updateSummary(selected)}
function attackEditor(r){return `<div class="attacks"><div class="attack"><b>⚔️ Angriff 1</b><label class="used"><input type="checkbox" data-field="a1u" data-row="${r.id}" ${r.attack1_used?'checked':''}> Angriff gemacht</label><div class="attack-grid"><label>⭐ Sterne<input type="number" min="0" max="3" data-field="a1s" data-row="${r.id}" value="${n(r.attack1_stars)}"></label><label>💥 Zerstörung %<input type="number" min="0" max="100" step="0.1" data-field="a1d" data-row="${r.id}" value="${n(r.attack1_destruction)}"></label></div></div><div class="attack"><b>⚔️ Angriff 2</b><label class="used"><input type="checkbox" data-field="a2u" data-row="${r.id}" ${r.attack2_used?'checked':''}> Angriff gemacht</label><div class="attack-grid"><label>⭐ Sterne<input type="number" min="0" max="3" data-field="a2s" data-row="${r.id}" value="${n(r.attack2_stars)}"></label><label>💥 Zerstörung %<input type="number" min="0" max="100" step="0.1" data-field="a2d" data-row="${r.id}" value="${n(r.attack2_destruction)}"></label></div></div></div>`}
function updateCount(){let c=document.querySelectorAll('.pick:checked').length;$('count').textContent=c+' / 25 ausgewählt'}
function selectAll(){document.querySelectorAll('.pick').forEach(x=>x.checked=true);updateCount()}function clearAll(){document.querySelectorAll('.pick').forEach(x=>x.checked=false);updateCount()}
async function saveParticipants(){if(!war)return;let ids=[...document.querySelectorAll('.pick:checked')].map(x=>x.dataset.id);if(ids.length>25){msg('⚠️ Bei einem 25-vs-25-Krieg dürfen höchstens 25 Spieler ausgewählt werden.','error');return}try{let current=rows.filter(r=>String(r.war_id)===String(war.id));for(let r of current)if(!ids.includes(String(r.member_id)))await api(WM+'?id=eq.'+encodeURIComponent(r.id),{method:'DELETE'});let existing=new Set(current.map(r=>String(r.member_id)));for(let id of ids)if(!existing.has(String(id)))await api(WM,{method:'POST',body:JSON.stringify({war_id:war.id,member_id:id,attacks:0,stars:0,destruction:0,attack1_used:false,attack1_stars:0,attack1_destruction:0,attack2_used:false,attack2_stars:0,attack2_destruction:0})});rows=await api(WM+'?select=*&order=id.asc');render();msg('✅ Teilnehmer gespeichert.','ok')}catch(e){console.error(e);msg('❌ '+e.message,'error')}}
async function saveAttack(rowId){let fields=[...document.querySelectorAll('[data-row="'+rowId+'"]')];let body={};for(let x of fields){let f=x.dataset.field;if(f==='a1u')body.attack1_used=x.checked;if(f==='a1s')body.attack1_stars=n(x.value);if(f==='a1d')body.attack1_destruction=n(x.value);if(f==='a2u')body.attack2_used=x.checked;if(f==='a2s')body.attack2_stars=n(x.value);if(f==='a2d')body.attack2_destruction=n(x.value)}body.attacks=(body.attack1_used?1:0)+(body.attack2_used?1:0);body.stars=(body.attack1_used?body.attack1_stars:0)+(body.attack2_used?body.attack2_stars:0);body.destruction=(body.attack1_used?body.attack1_destruction:0)+(body.attack2_used?body.attack2_destruction:0);await api(WM+'?id=eq.'+encodeURIComponent(rowId),{method:'PATCH',body:JSON.stringify(body)});rows=await api(WM+'?select=*&order=id.asc');render()}
document.addEventListener('change',e=>{if(e.target.dataset.row){clearTimeout(window.saveTimer);window.saveTimer=setTimeout(()=>saveAttack(e.target.dataset.row).catch(x=>msg('❌ '+x.message,'error')),250)}});function updateSummary(list){let attacks=0,total=0,stars=0,open=0;list.forEach(r=>{let a=n(r.attacks),s=n(r.stars);attacks+=a;total+=2;stars+=s;open+=2-a});$('sumPlayers').textContent=list.length;$('sumAttacks').textContent=attacks+' / '+total;$('sumStars').textContent=stars;$('sumOpen').textContent=open}function msg(t,c){$('msg').className='msg '+(c||'');$('msg').textContent=t}load();
</script></body></html>

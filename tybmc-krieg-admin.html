<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TYBMC – Kriegsverwaltung</title><style>body{margin:0;background:radial-gradient(circle at 50% 0,#4b2158,#0b080e 65%);color:#fffaf0;font-family:Arial,sans-serif;padding:14px}main{max-width:900px;margin:auto}.card{background:#171122ee;border:2px solid #f4b82e;border-radius:18px;padding:18px;box-shadow:0 15px 40px #0009;margin-bottom:16px}h1,h2{color:#ffd45b;margin-top:0}.sub,.role{color:#b9afc0;font-size:14px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}button,a{padding:11px 14px;border-radius:11px;border:2px solid #8b6324;background:#24152e;color:#ffd45b;font-weight:900;text-decoration:none;cursor:pointer}button.primary{background:linear-gradient(135deg,#ffc43d,#ff9f1c);color:#171122}.status{padding:11px;border-radius:10px;background:#09200f;color:#31e36b;font-weight:bold;margin:12px 0}.count{color:#ffd45b;font-weight:900}.war-select{width:100%;padding:12px;border-radius:11px;border:1px solid #55445f;background:#0c0911;color:#fff;font-weight:800;font-size:15px}.member{border:1px solid #ffffff20;border-radius:14px;background:#0c0911;margin:9px 0;overflow:hidden}.member-head{display:grid;grid-template-columns:42px 1fr auto;align-items:center;gap:8px;padding:12px}.member-head input{width:22px;height:22px}.member-name{font-weight:900;font-size:16px}.attacks{display:grid;grid-template-columns:1fr 1fr;gap:9px;padding:0 12px 12px}.attack{border:1px solid #ffffff20;border-radius:11px;padding:10px;background:#17131d}.attack b{display:block;color:#ffd45b;margin-bottom:7px}.attack-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}.attack-grid input{width:100%;box-sizing:border-box;padding:9px;border-radius:8px;border:1px solid #55445f;background:#08070b;color:white}.attack-grid label{font-size:11px;color:#a99fb0}.save-attack,.delete-attack{margin-top:9px;width:100%;padding:9px;border-radius:9px;font-weight:900}.save-attack{border:1px solid #ffc43d66;background:#ffc43d12;color:#ffd45b}.delete-attack{border:1px solid #ff777766;background:#ff777712;color:#ff9b9b}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.sum{padding:11px;border:1px solid #ffffff20;border-radius:11px;background:#0b0910;text-align:center}.sum b{display:block;color:#ffd45b;font-size:20px}.sum span{color:#9e94aa;font-size:11px}.msg{margin-top:12px;font-weight:900}.error{color:#ff7777}.ok{color:#31e36b}@media(max-width:650px){.attacks{grid-template-columns:1fr}.summary{grid-template-columns:1fr 1fr}.member-head{grid-template-columns:38px 1fr auto}button,a{font-size:13px;padding:10px 11px}}</style></head><body><main><div class="card"><h1>⚔️ Kriegsverwaltung</h1><p class="sub">Aktuellen oder vergangenen Krieg auswählen, Teilnehmer verwalten und Angriff 1 & Angriff 2 pflegen.</p><label for="warSelect" class="sub">Krieg auswählen</label><select id="warSelect" class="war-select"></select><div id="warStatus" class="status">⏳ Lade Kriege …</div><div id="warInfo"></div></div><div class="card"><h2>👥 Kriegsteilnehmer</h2><div class="toolbar"><button onclick="selectAll()">☑️ Alle auswählen</button><button onclick="clearAll()">⬜ Auswahl löschen</button><button class="primary" onclick="saveParticipants()">💾 Teilnehmer speichern</button></div><div class="count" id="count">0 / 25 ausgewählt</div><div id="members">⏳ Mitglieder werden geladen …</div><div id="msg" class="msg"></div></div><div class="card"><h2>📊 Kriegsübersicht</h2><div class="summary"><div class="sum"><b id="sumPlayers">0</b><span>Teilnehmer</span></div><div class="sum"><b id="sumAttacks">0 / 0</b><span>Angriffe</span></div><div class="sum"><b id="sumStars">0</b><span>Sterne</span></div><div class="sum"><b id="sumOpen">0</b><span>Angriffe offen</span></div></div></div><div class="toolbar"><a href="tybmc-kriege.html">⚔️ Kriegsseite</a><a href="tybmc.html">🏠 TYBMC</a></div></main><script src="tybmc-members-data.js"></script><script>const SUPABASE_URL='https://jvgqvtnqncelbhuordzy.supabase.co',SUPABASE_KEY='sb_publishable_4PusmhJVMm0b3Bm-2Y-FPQ__tnZZzZO',H={'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY,'Content-Type':'application/json','Prefer':'return=representation'},W=SUPABASE_URL+'/rest/v1/tybmc_wars',WM=SUPABASE_URL+'/rest/v1/tybmc_war_members';let wars=[],war=null,rows=[];const members=Array.isArray(window.TYBMC_MEMBERS)?window.TYBMC_MEMBERS:[], $=x=>document.getElementById(x),n=x=>Number(x||0),esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));async function api(url,opt={}){const r=await fetch(url,{...opt,headers:{...H,...(opt.headers||{})}});if(!r.ok)throw new Error(await r.text());return r.status===204?null:r.json()}function formatDate(v){if(!v)return'';return new Date(v).toLocaleDateString('de-DE')}function warSize(v){const m=String(v||'').match(/(\d+)\s*(?:vs\.?|x|×)\s*(\d+)/i);return m?Number(m[1]):25}function uniqueWarRows(list){const seen=new Set(),out=[];for(const r of list){const key=String(r.member_id);if(!seen.has(key)){seen.add(key);out.push(r)}}return out}async function load(){try{[wars,rows]=await Promise.all([api(W+'?select=*&order=created_at.desc'),api(WM+'?select=*&order=id.asc')]);const s=$('warSelect');s.innerHTML=wars.map(w=>`<option value="${esc(w.id)}">${esc(w.opponent||'Gegner')} • ${esc(w.war_size||'25 vs. 25')} • ${formatDate(w.created_at)} • ${esc(w.status||'')}</option>`).join('');s.onchange=()=>{war=wars.find(w=>String(w.id)===String(s.value));render()};war=wars[0]||null;if(war)s.value=war.id;render();$('warStatus').textContent='✅ Daten geladen';$('warStatus').className='status'}catch(e){$('warStatus').textContent='❌ '+e.message;$('warStatus').className='status error'}}function attackCount(r){return (n(r.attack1_stars)>0||n(r.attack1_destruction)>0?1:0)+(n(r.attack2_stars)>0||n(r.attack2_destruction)>0?1:0)}function render(){if(!war){$('warInfo').innerHTML='<div class="status">Noch kein TYBMC-Krieg vorhanden.</div>';return}const size=warSize(war.war_size),all=rows.filter(r=>String(r.war_id)===String(war.id)),selected=uniqueWarRows(all),by=new Map(selected.map(r=>[String(r.member_id),r]));$('warStatus').textContent=war.status==='active'?'🟢 AKTIVER KRIEG':'📜 VERGANGENER KRIEG';$('warInfo').innerHTML=`<div class="summary"><div class="sum"><b>${esc(war.opponent||'Gegner')}</b><span>GEGNER</span></div><div class="sum"><b>${size} vs. ${size}</b><span>KRIEGSGRÖSSE</span></div><div class="sum"><b>${selected.length} / ${size}</b><span>TEILNEHMER</span></div><div class="sum"><b>${esc(war.status||'')}</b><span>STATUS</span></div></div>`;$('count').textContent=selected.length+' / '+size+' ausgewählt';$('members').innerHTML=members.map((m,i)=>{const memberId=i+1,r=by.get(String(memberId));return `<div class="member"><div class="member-head"><input type="checkbox" class="pick" data-id="${memberId}" ${r?'checked':''} onchange="updateCount()"><div><div class="member-name">${esc(m.name)}</div><div class="role">#${String(memberId).padStart(2,'0')} • ${esc(m.role||'Mitglied')}</div></div><span>${r?'⚔️':''}</span></div>${r?attackEditor(r):''}</div>`}).join('');updateSummary(selected)}function attackEditor(r){return `<div class="attacks"><div class="attack"><b>⚔️ Angriff 1</b><div class="attack-grid"><label>⭐ Sterne<input type="number" id="a1s-${r.id}" min="0" max="3" value="${n(r.attack1_stars)}"></label><label>💥 Zerstörung %<input type="number" id="a1d-${r.id}" min="0" max="100" step="0.1" value="${n(r.attack1_destruction)}"></label></div></div><div class="attack"><b>⚔️ Angriff 2</b><div class="attack-grid"><label>⭐ Sterne<input type="number" id="a2s-${r.id}" min="0" max="3" value="${n(r.attack2_stars)}"></label><label>💥 Zerstörung %<input type="number" id="a2d-${r.id}" min="0" max="100" step="0.1" value="${n(r.attack2_destruction)}"></label></div></div><button class="save-attack" onclick="saveAttack(${r.id})">💾 Angriffe dieses Spielers speichern</button><button class="delete-attack" onclick="deleteAttacks(${r.id})">🗑️ Angriffe dieses Spielers löschen</button></div>`}function updateCount(){$('count').textContent=document.querySelectorAll('.pick:checked').length+' / '+warSize(war?.war_size)+' ausgewählt'}function selectAll(){const size=warSize(war?.war_size);document.querySelectorAll('.pick').forEach((x,i)=>x.checked=i<size);updateCount()}function clearAll(){document.querySelectorAll('.pick').forEach(x=>x.checked=false);updateCount()}function updateSummary(list){let attacks=0,stars=0,open=0;list.forEach(r=>{attacks+=attackCount(r);stars+=n(r.attack1_stars)+n(r.attack2_stars);open+=2-attackCount(r)});$('sumPlayers').textContent=list.length;$('sumAttacks').textContent=attacks+' / '+(list.length*2);$('sumStars').textContent=stars;$('sumOpen').textContent=open}async function saveParticipants(){if(!war)return;const ids=[...document.querySelectorAll('.pick:checked')].map(x=>Number(x.dataset.id)),size=warSize(war.war_size);if(ids.length>size){msg(`⚠️ Maximal ${size} Teilnehmer möglich.`,'error');return}try{const current=rows.filter(r=>String(r.war_id)===String(war.id)),keep=new Set();for(const r of current){const mid=Number(r.member_id);if(!ids.includes(mid)||keep.has(mid)){await api(WM+'?id=eq.'+encodeURIComponent(r.id),{method:'DELETE'})}else{keep.add(mid)}}for(const id of ids)if(!keep.has(id))await api(WM,{method:'POST',body:JSON.stringify({war_id:war.id,member_id:id,map_position:id,attack1_stars:0,attack1_destruction:0,attack2_stars:0,attack2_destruction:0})});rows=await api(WM+'?select=*&order=id.asc');render();msg('✅ Teilnehmer gespeichert. Doppelte Einträge wurden bereinigt.','ok')}catch(e){msg('❌ '+e.message,'error')}}async function saveAttack(id){const body={attack1_stars:n($('a1s-'+id).value),attack1_destruction:n($('a1d-'+id).value),attack2_stars:n($('a2s-'+id).value),attack2_destruction:n($('a2d-'+id).value)};try{await api(WM+'?id=eq.'+encodeURIComponent(id),{method:'PATCH',body:JSON.stringify(body)});rows=await api(WM+'?select=*&order=id.asc');render();msg('✅ Angriffe gespeichert.','ok')}catch(e){msg('❌ '+e.message,'error')}}async function deleteAttacks(id){try{await api(WM+'?id=eq.'+encodeURIComponent(id),{method:'PATCH',body:JSON.stringify({attack1_stars:0,attack1_destruction:0,attack2_stars:0,attack2_destruction:0})});rows=await api(WM+'?select=*&order=id.asc');render();msg('✅ Angriffe gelöscht.','ok')}catch(e){msg('❌ '+e.message,'error')}}function msg(t,c){$('msg').className='msg '+(c||'');$('msg').textContent=t}load();</script></body></html>

name: Aktualisiere Kriegsdaten

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/update-war-data.mjs'
      - '.github/workflows/update-war-data.yml'
      - 'auto-war-stats.js'
      - 'clan-finder.html'
      - 'live-war-home.js'

permissions:
  contents: write

env:
  CLASH_API_TOKEN: ${{ secrets.CLASH_API_TOKEN }}

jobs:
  update-war-data:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Kriegsdaten automatisch abrufen
        run: node scripts/update-war-data.mjs

      - name: Alte Supabase-Live-Kriegsanzeige entfernen
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          start_marker = "<script>(function(){const U='https://jvgqvtnqncelbhuordzy.supabase.co',K="
          endpoint_marker = "endpoint=U+'/rest/v1/clan_wars?select=*"
          start = text.find(start_marker)
          if start != -1:
              endpoint = text.find(endpoint_marker, start)
              end = text.find('</script>', endpoint if endpoint != -1 else start)
              if endpoint != -1 and end != -1:
                  text = text[:start] + text[end + len('</script>'):]
                  path.write_text(text, encoding='utf-8')
                  print('Alte Supabase-Kriegsanzeige entfernt.')
          PY

      - name: Automatische Statistik in Kriegsseite aktivieren
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('krieg.html')
          text = path.read_text(encoding='utf-8')
          tag = '<script src="auto-war-stats.js?v=1"></script>'
          if tag not in text:
              marker = '</body>'
              if marker not in text:
                  raise SystemExit('krieg.html enthält kein </body>.')
              text = text.replace(marker, tag + '\n' + marker, 1)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Live-Kriegsanzeige auf Startseite aktivieren
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          tag = '<script src="live-war-home.js?v=1"></script>'
          if tag not in text:
              marker = '</body>'
              if marker not in text:
                  raise SystemExit('index.html enthält kein </body>.')
              text = text.replace(marker, tag + '\n' + marker, 1)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Änderungen speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            git add war-data.json krieg.html auto-war-stats.js index.html live-war-home.js
            if git diff --cached --quiet; then
              exit 0
            fi

            git commit -m "Automatisch: Live-Kriegsanzeige auf Startseite verbinden"

            if git push origin HEAD:main; then
              exit 0
            fi

            echo "Push wurde abgelehnt. Remote-Änderungen werden übernommen (Versuch $attempt/3)."
            git fetch origin main
            git rebase origin/main || {
              echo "Rebase-Konflikt. Lokalen automatischen Commit verwerfen und Daten erneut vom aktuellen main abrufen."
              git rebase --abort || true
              git reset --hard origin/main
              node scripts/update-war-data.mjs
              python3 - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          start_marker = "<script>(function(){const U='https://jvgqvtnqncelbhuordzy.supabase.co',K="
          endpoint_marker = "endpoint=U+'/rest/v1/clan_wars?select=*"
          start = text.find(start_marker)
          if start != -1:
              endpoint = text.find(endpoint_marker, start)
              end = text.find('</script>', endpoint if endpoint != -1 else start)
              if endpoint != -1 and end != -1:
                  text = text[:start] + text[end + len('</script>'):]
                  path.write_text(text, encoding='utf-8')
          PY
              python3 - <<'PY'
          from pathlib import Path
          path = Path('krieg.html')
          text = path.read_text(encoding='utf-8')
          tag = '<script src="auto-war-stats.js?v=1"></script>'
          if tag not in text:
              marker = '</body>'
              if marker not in text:
                  raise SystemExit('krieg.html enthält kein </body>.')
              text = text.replace(marker, tag + '\n' + marker, 1)
              path.write_text(text, encoding='utf-8')
          PY
              python3 - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          tag = '<script src="live-war-home.js?v=1"></script>'
          if tag not in text:
              marker = '</body>'
              if marker not in text:
                  raise SystemExit('index.html enthält kein </body>.')
              text = text.replace(marker, tag + '\n' + marker, 1)
              path.write_text(text, encoding='utf-8')
          PY
            }
          done

          echo "Push konnte nach 3 Versuchen nicht abgeschlossen werden."
          exit 1

name: Aktualisiere Kriegsdaten

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
  push:
    paths:
      - 'scripts/update-war-data.mjs'
      - '.github/workflows/update-war-data.yml'

permissions:
  contents: write

env:
  CLASH_API_TOKEN: ${{ secrets.CLASH_API_TOKEN }}

jobs:
  update-war-data:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Kriegsdaten automatisch abrufen
        run: node scripts/update-war-data.mjs

      - name: Änderungen speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add war-data.json
          git diff --cached --quiet && exit 0
          git commit -m "Automatisch: Kriegsdaten aktualisieren"
          git push

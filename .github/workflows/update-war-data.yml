name: Aktualisiere Kriegsdaten

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-war-data:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v5

      - name: Kriegsdaten von ClashKing abrufen
        run: node scripts/update-war-data.mjs

      - name: Änderungen speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add war-data.json
          git diff --cached --quiet && exit 0
          git commit -m "Automatisch: Kriegsdaten aktualisieren"
          git push

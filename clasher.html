<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cold N' Dark – Clasher-Bereich</title>
<style>
:root{--bg:#08050f;--panel:#151020;--gold:#ffc43d;--text:#f8f5ff;--muted:#aaa1bb;--line:#ffffff18}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% -8%,#4b286d 0,#21142f 25%,#090611 63%);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif}header{border-bottom:1px solid var(--line);background:#08050fee;backdrop-filter:blur(18px);position:sticky;top:0;z-index:10}.nav{max-width:1100px;margin:auto;padding:12px 18px;display:flex;align-items:center;gap:14px}.logo{width:50px;height:50px;object-fit:contain}.brand{flex:1}.brand strong{display:block;letter-spacing:2px}.brand small{color:var(--gold);font-size:10px;font-weight:900}.logout{border:1px solid #ffc43d55;background:#ffc43d0a;color:var(--gold);border-radius:10px;padding:9px 12px;font-weight:900;cursor:pointer}main{max-width:1100px;margin:auto;padding:28px 18px 70px}.hero{border:1px solid #ffc43d35;border-radius:22px;background:linear-gradient(135deg,#241531e8,#100c18e8);padding:26px}.eyebrow{color:var(--gold);font-size:11px;font-weight:900}.hero h1{font-size:clamp(34px,6vw,56px);margin:8px 0}.hero h1 span{color:var(--gold)}.hero p{color:var(--muted);margin:0}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:18px}.card{display:block;border:1px solid var(--line);border-radius:18px;background:#ffffff06;padding:22px;color:inherit;text-decoration:none}.card:hover{border-color:#ffc43d66;transform:translateY(-2px)}.icon{font-size:38px}.card h2{margin:8px 0 5px}.card p{margin:0;color:var(--muted)}.member{margin-top:18px;border:1px solid #ffc43d30;border-radius:18px;background:#ffc43d08;padding:18px}.member b{color:var(--gold)}.loading{text-align:center;padding:40px;color:var(--muted)}@media(max-width:650px){.grid{grid-template-columns:1fr}.nav{padding:9px 12px}.brand small{display:none}}
</style>
</head>
<body>
<header><div class="nav"><img class="logo" src="Wappen.png" alt="Cold N' Dark"><div class="brand"><strong>COLD N' DARK</strong><small>GESCHÜTZTER CLASHER-BEREICH</small></div><button id="logout" class="logout">Abmelden</button></div></header>
<main id="app"><div class="loading">🔐 Sitzung wird geprüft …</div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="members-data.js"></script>
<script>
const SUPABASE_URL='https://jvgqvtnqncelbhuordzy.supabase.co',SUPABASE_KEY='sb_publishable_4PusmhJVMm0b3Bm-2Y-FPQ__tnZZzZO';const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);const app=document.getElementById('app');
function findMember(name){return (window.COLD_N_DARK_MEMBERS||[]).find(m=>m.name.toLowerCase()===String(name||'').toLowerCase())}
function render(session){const name=session.user.user_metadata?.display_name||session.user.user_metadata?.name||'Clasher';const member=findMember(name);app.innerHTML=`<section class="hero"><div class="eyebrow">🛡️ ANGEMELDET</div><h1>Willkommen, <span>${name.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}</span></h1><p>Hier beginnt dein geschützter Cold N' Dark Bereich. Alle Inhalte sind für angemeldete Clasher sichtbar; Änderungen bleiben dem Admin vorbehalten.</p></section><div class="member"><b>👤 Dein Profil</b><br>${member?((member.role==='leader'?'🔥 Anführer':member.role==='coLeader'?'🛡️ Vize-Anführer':member.role==='admin'?'👑 Ältester':'⚔️ Mitglied')+' • TH '+(member.townHallLevel||'?')):'Mitgliederdaten werden noch zugeordnet.'}</div><section class="grid"><a class="card" href="krieg.html"><div class="icon">⚔️</div><h2>Kriege</h2><p>Laufender CK, Teilnehmer, Angriffe und Ergebnisse.</p></a><a class="card" href="cwl.html"><div class="icon">🏆</div><h2>CWL</h2><p>CWL-Anmeldung und Auswertung.</p></a><a class="card" href="mitglieder.html"><div class="icon">👥</div><h2>Mitglieder</h2><p>Clan-Kader und Spielerprofile.</p></a><a class="card" href="news.html"><div class="icon">📣</div><h2>News</h2><p>Clan-News und Ankündigungen.</p></a><a class="card" href="monats-awards.html"><div class="icon">🏆</div><h2>Monats-Awards</h2><p>Top-Leistungen und Spieler des Monats.</p></a></section>`}
document.getElementById('logout').onclick=async()=>{await db.auth.signOut();location.href='index.html'};
(async()=>{const {data,error}=await db.auth.getSession();if(error||!data.session){location.href='clasher-login.html';return}render(data.session)})();
</script>
</body></html>

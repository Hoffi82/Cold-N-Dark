<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cold N' Dark – Registrierte Clasher</title><style>:root{--bg:#08050f;--panel:#151020;--gold:#ffc43d;--text:#f8f5ff;--muted:#aaa1bb;--line:#ffffff18}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -8%,#4b286d 0,#21142f 25%,#090611 63%);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif}.wrap{max-width:1050px;margin:auto;padding:28px 18px 70px}.head,.card{border:1px solid var(--line);border-radius:20px;background:#151020e8;padding:22px;margin-bottom:16px}.head h1{margin:0 0 6px}.gold{color:var(--gold)}.muted{color:var(--muted)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}.stat{padding:14px;border:1px solid var(--line);border-radius:14px;text-align:center}.stat b{display:block;color:var(--gold);font-size:25px}.list{display:grid;gap:8px}.row{display:grid;grid-template-columns:1fr 130px 130px;gap:10px;align-items:center;padding:13px 14px;border:1px solid var(--line);border-radius:13px;background:#ffffff05}.ok{color:#63e68b;font-weight:900}.no{color:#ffb454;font-weight:900}.btn{display:inline-block;margin-top:14px;padding:11px 15px;border-radius:11px;background:#ffc43d;color:#211000;text-decoration:none;font-weight:1000}.msg{margin-top:12px}.err{color:#ff7777}@media(max-width:650px){.stats{grid-template-columns:1fr}.row{grid-template-columns:1fr}.row span{font-size:12px}}</style></head><body><main class="wrap"><section class="head"><h1>👥 <span class="gold">Registrierte Clasher</span></h1><p class="muted">Admin-Übersicht über den zentralen Cold N' Dark Kader. Der Status wird aus der Registrierungs-Tabelle geladen.</p><div class="stats"><div class="stat"><b id="total">–</b><span>KADER</span></div><div class="stat"><b id="registered">–</b><span>REGISTRIERT</span></div><div class="stat"><b id="missing">–</b><span>NOCH OFFEN</span></div></div></section><section class="card"><div id="msg" class="muted">🔄 Registrierungsstatus wird geladen …</div><div id="list" class="list"></div><a class="btn" href="admin.html">← Zurück zum Admin</a></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="members-data.js"></script><script>const U='https://jvgqvtnqncelbhuordzy.supabase.co',K='sb_publishable_4PusmhJVMm0b3Bm-2Y-FPQ__tnZZzZO',db=window.supabase.createClient(U,K),members=window.COLD_N_DARK_MEMBERS||[],$=id=>document.getElementById(id);function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function load(){const s=await db.auth.getSession();if(!s.data.session){location.href='admin-login.html?next=/clasher-admin.html';return}try{const r=await fetch(U+'/rest/v1/clasher_registrations?select=display_name,is_active&order=display_name.asc',{headers:{apikey:K,Authorization:'Bearer '+K,Accept:'application/json'},cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const rows=await r.json();const byName=new Map(rows.map(x=>[String(x.display_name||'').toLowerCase(),x]));let reg=0;const html=members.map(m=>{const x=byName.get(m.name.toLowerCase()),active=!!x?.is_active;if(x)reg++;return '<div class="row"><strong>'+esc(m.name)+'</strong><span>'+(x?(active?'<span class="ok">● Aktiv</span>':'<span class="no">● Inaktiv</span>'):'<span class="no">● Noch nicht registriert</span>')+'</span><span class="muted">TH '+esc(m.townHallLevel||'?')+'</span></div>'}).join('');$('total').textContent=members.length;$('registered').textContent=reg;$('missing').textContent=members.length-reg;$('list').innerHTML=html;$('msg').textContent='✅ Registrierungsstatus geladen.'}catch(e){console.error(e);$('msg').className='msg err';$('msg').textContent='❌ Die Tabelle „clasher_registrations“ ist noch nicht in Supabase erreichbar. Die Oberfläche ist vorbereitet.'}}load();</script></body></html>

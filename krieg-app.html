<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#09070d"><title>Cold N' Dark – Krieg</title>
<style>
:root{--gold:#ffc43d;--gold2:#ff9f1c;--text:#f7f4ff;--muted:#b9b2c9;--line:#ffffff1f;--green:#45d483;--red:#ff6565}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,#302044,#09070d 58%);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;padding-bottom:86px}.appbar{position:sticky;top:0;z-index:20;background:#08060df2;border-bottom:1px solid var(--line);padding:12px 16px}.bar{max-width:760px;margin:auto;display:flex;align-items:center;gap:12px}.logo{width:46px;height:46px;border-radius:13px;border:2px solid var(--gold);object-fit:cover}.brand{flex:1}.brand strong{display:block;letter-spacing:1.5px}.brand small{color:var(--gold);font-weight:800;font-size:11px}.back{color:var(--gold);text-decoration:none;font-size:12px;font-weight:800}main{max-width:760px;margin:auto;padding:22px 16px}.title{margin-bottom:18px}.badge{display:inline-block;border:1px solid #ffc43d66;border-radius:999px;padding:5px 10px;color:var(--gold);font-weight:800;font-size:11px}.title h1{font-size:38px;margin:12px 0 4px}.title p{color:var(--muted);margin:0}.card{border:1px solid var(--line);border-radius:18px;background:#171122dd;padding:18px;margin-top:14px}.war{border-color:#ffc43d66;background:linear-gradient(135deg,#171122,#21172e)}.top{display:flex;justify-content:space-between;gap:10px;align-items:center}.top h2{margin:0;font-size:20px}.status{color:var(--green);font-weight:900;font-size:11px}.status.finished{color:var(--muted)}.opponent{margin-top:16px;text-align:center}.opponent small{color:var(--muted);display:block}.opponent strong{font-size:27px;color:var(--gold)}.score{display:grid;grid-template-columns:1fr 90px 1fr;align-items:center;gap:8px;margin:18px 0}.team{text-align:center;font-weight:900}.stars{font-size:28px;color:var(--gold);font-weight:900;text-align:center}.team span{display:block;color:var(--muted);font-size:11px;font-weight:500}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.metric{text-align:center;padding:12px 5px;border:1px solid #ffffff12;border-radius:12px;background:#ffffff06}.metric b{display:block;color:var(--gold);font-size:20px}.metric span{font-size:11px;color:var(--muted)}.players{display:grid;gap:8px;margin-top:12px}.player{display:flex;align-items:center;justify-content:space-between;padding:12px;border:1px solid var(--line);border-radius:12px;background:#ffffff06}.player strong{display:block}.player small{color:var(--muted)}.attack{font-size:12px;font-weight:900;color:var(--muted)}.info{color:var(--muted);font-size:13px}.error{color:var(--red)}.history{display:grid;gap:8px;margin-top:12px}.history-row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:12px;background:#ffffff06}.history-row strong{display:block}.history-row small{color:var(--muted)}.result{font-weight:900}.win{color:var(--green)}.lose{color:var(--red)}.tie{color:var(--gold)}.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#08060df5;border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom))}.navin{max-width:760px;margin:auto;display:grid;grid-template-columns:repeat(5,1fr);gap:4px}.nav a{text-align:center;text-decoration:none;color:var(--muted);font-size:10px;font-weight:800;padding:5px 2px;border-radius:10px}.nav a.active,.nav a:hover{color:var(--gold);background:#ffc43d0c}.nav i{display:block;font-style:normal;font-size:20px;line-height:22px}@media(max-width:390px){.score{grid-template-columns:1fr 65px 1fr}.opponent strong{font-size:23px}}
</style></head>
<body><header class="appbar"><div class="bar"><img class="logo" src="Wappen.png" alt="Wappen"><div class="brand"><strong>COLD N' DARK</strong><small>CLAN-APP • KRIEG</small></div><a class="back" href="app.html">← Start</a></div></header>
<main><section class="title"><span class="badge">⚔️ KRIEG</span><h1>Clan-Krieg</h1><p>Die Kriegsdaten werden automatisch aus ClashKing aktualisiert.</p></section><section id="war"><div class="card">⏳ Kriegsdaten werden geladen …</div></section><section class="card"><h2>👥 Teilnehmer</h2><div id="players" class="players"><div class="info">⏳ Teilnehmer werden geladen …</div></div></section><section class="card"><h2>📜 Letzte Kriege</h2><div id="history" class="history"><div class="info">⏳ Kriegshistorie wird geladen …</div></div></section></main>
<nav class="nav"><div class="navin"><a href="app.html"><i>⌂</i>Start</a><a class="active" href="krieg-app.html"><i>⚔️</i>Krieg</a><a href="cwl-app.html"><i>🏆</i>CWL</a><a href="mitglieder-app.html"><i>👥</i>Mitglieder</a><a href="mehr-app.html"><i>☰</i>Mehr</a></div></nav>
<script>
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const n=v=>Number(v||0);const fmt=v=>{if(!v)return '–';try{return new Date(v).toLocaleDateString('de-DE')}catch{return v}};
function resultClass(r){r=String(r||'').toLowerCase();return r==='win'||r==='won'?'win':r==='lose'||r==='loss'?'lose':'tie'}
function renderCurrent(w){if(!w){document.getElementById('war').innerHTML='<div class="card info">🏁 Aktuell ist kein laufender Krieg eingetragen. Die Seite prüft automatisch weiter.</div>';document.getElementById('players').innerHTML='<div class="info">Keine aktuellen Teilnehmer.</div>';return}const status=String(w.state||'').toLowerCase();const label=status==='warDay'?'KRIEGSTAG':status==='preparation'?'VORBEREITUNG':status.toUpperCase();document.getElementById('war').innerHTML=`<section class="card war"><div class="top"><h2>Aktueller Clan-Krieg</h2><span class="status">● ${esc(label)}</span></div><div class="opponent"><small>Gegner</small><strong>${esc(w.opponent||'GEGNERCLAN')}</strong></div><div class="score"><div class="team">Cold N' Dark<span>unser Clan</span></div><div class="stars">${n(w.ourStars)} : ${n(w.enemyStars)}</div><div class="team">${esc(w.opponent||'Gegner')}<span>Gegner</span></div></div><div class="metrics"><div class="metric"><b>${n(w.ourAttacks)} : ${n(w.enemyAttacks)}</b><span>Angriffe</span></div><div class="metric"><b>${n(w.ourStars)} : ${n(w.enemyStars)}</b><span>Sterne</span></div><div class="metric"><b>${esc(w.warSize||'–')}</b><span>Krieg</span></div></div></section>`;const list=Array.isArray(w.players)?[...w.players].sort((a,b)=>n(b.stars)-n(a.stars)||n(b.destruction)-n(a.destruction)):[];document.getElementById('players').innerHTML=list.length?list.map(x=>`<div class="player"><div><strong>${esc(x.name)}</strong><small>Angriffe: ${n(x.attacks)} • Zerstörung: ${n(x.destruction)}%</small></div><span class="attack">${n(x.stars)} ⭐</span></div>`).join(''):'<div class="info">Noch keine Teilnehmerdaten vorhanden.</div>'}
function renderHistory(items){if(!Array.isArray(items)||!items.length){document.getElementById('history').innerHTML='<div class="info">Noch keine Kriegshistorie vorhanden.</div>';return}const rows=items.slice(0,15).map(w=>{const clan=w.clan||w.ourClan||{};const opp=w.opponent||w.enemyClan||{};const r=w.result||w.resultType||'';const stars=clan.stars??clan.clanStars??0;const enemyStars=opp.stars??opp.clanStars??0;return `<div class="history-row"><div><strong>${esc(opp.name||w.opponentName||'Gegner')}</strong><small>${fmt(w.endTime||w.end_time||w.date)} • ${esc(w.teamSize||w.warSize||'')}er Krieg</small></div><span class="result ${resultClass(r)}">${esc(r||stars+' : '+enemyStars)}</span></div>`}).join('');document.getElementById('history').innerHTML=rows}
async function load(){try{const r=await fetch('war-data.json?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('Kriegsdaten nicht verfügbar.');const data=await r.json();renderCurrent(data.current);renderHistory(data.previous)}catch(e){document.getElementById('war').innerHTML='<div class="card error">❌ '+esc(e.message)+'</div>';document.getElementById('players').innerHTML='<div class="info">Teilnehmer konnten nicht geladen werden.</div>';document.getElementById('history').innerHTML='<div class="info">Kriegshistorie konnte nicht geladen werden.</div>'}}load();
</script></body></html>

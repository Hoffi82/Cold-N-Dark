<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090611"><title>TYBMC – Mitglieder</title><style>
:root{--bg:#08050f;--panel:#151020;--gold:#ffc43d;--gold2:#ff9a18;--text:#f8f5ff;--muted:#aaa1bb;--line:#ffffff18;--blue:#56b8ff}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% -8%,#4b286d 0,#21142f 25%,#090611 63%);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif}header{position:sticky;top:0;z-index:20;background:#08050fee;backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}.nav{max-width:1380px;margin:auto;padding:12px 18px;display:flex;align-items:center;gap:14px}.logo{width:54px;height:54px;object-fit:cover;border-radius:15px;border:2px solid var(--gold)}.brand{flex:1}.brand strong{display:block;font-size:19px;letter-spacing:2px}.brand small{color:var(--gold);font-size:11px;font-weight:900}.nav a{color:var(--muted);text-decoration:none;font-size:13px;font-weight:800;padding:8px 10px;border-radius:10px}.nav a.active,.nav a:hover{color:var(--gold);background:#ffc43d0d}main{max-width:1380px;margin:auto;padding:30px 18px 70px}.hero{border:1px solid #ffc43d25;border-radius:25px;background:linear-gradient(135deg,#241531e8,#100c18e8);padding:25px 26px;box-shadow:0 22px 60px #0008}.hero-top{display:flex;align-items:center;gap:18px}.hero-logo{width:82px;height:82px;object-fit:contain;border:2px solid var(--gold);border-radius:20px;background:#0b0910;padding:7px}.eyebrow{color:var(--gold);font-size:11px;font-weight:900;border:1px solid #ffc43d45;border-radius:999px;padding:6px 10px}.hero h1{font-size:clamp(36px,5vw,58px);line-height:1;margin:9px 0 5px}.hero h1 span{color:var(--gold)}.hero p{margin:0;color:var(--muted);font-size:15px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:22px}.stat{border:1px solid var(--line);border-radius:16px;background:#ffffff06;text-align:center;padding:12px 7px}.stat b{display:block;color:var(--gold);font-size:25px}.stat span{display:block;color:var(--muted);font-size:10px;font-weight:800}.tools{display:grid;grid-template-columns:1fr auto;gap:10px;margin:18px 0 10px}.search{width:100%;border:1px solid var(--line);border-radius:15px;background:#110d19;color:var(--text);padding:13px 15px;font:inherit;outline:none}.count{display:grid;place-items:center;padding:0 18px;border:1px solid #ffc43d30;border-radius:15px;background:#ffc43d08;color:var(--gold);font-weight:900}.section-head{display:flex;align-items:end;justify-content:space-between;gap:12px;margin:15px 0 12px}.section-head h2{margin:0;font-size:21px}.section-head span{color:var(--muted);font-size:12px}.member-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}.member{position:relative;overflow:hidden;min-width:0;border:1px solid var(--line);border-radius:17px;background:linear-gradient(145deg,#1b1428ee,#100c18e8);padding:14px;box-shadow:0 9px 28px #0005;transition:.18s}.member:hover{transform:translateY(-3px);border-color:#ffc43d55}.member-link{display:block;color:inherit;text-decoration:none}.topline{display:flex;align-items:center;justify-content:space-between;gap:7px}.rank{color:#756c85;font-size:11px;font-weight:900}.role-pill{font-size:9px;font-weight:900;color:var(--gold);border:1px solid #ffc43d30;background:#ffc43d0a;border-radius:999px;padding:4px 6px;white-space:nowrap}.avatar{width:52px;height:52px;margin:10px 0 9px;border-radius:14px;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#59327f,#1c132b 70%);border:1px solid #a66cff2b;font-weight:1000}.name{font-size:15px;font-weight:950;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sub{color:var(--muted);font-size:10px;margin-top:3px}.profile{display:none;margin:18px 0;border:1px solid #ffc43d45;border-radius:20px;background:linear-gradient(145deg,#241531,#100c18);padding:22px;box-shadow:0 14px 35px #0007}.profile.show{display:block}.profile-inner{display:flex;align-items:center;gap:18px}.profile-avatar{width:80px;height:80px;border-radius:20px;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#59327f,#1c132b 70%);border:2px solid var(--gold);font-size:24px;font-weight:1000}.profile h2{margin:0 0 5px;font-size:30px}.profile p{margin:3px 0;color:var(--muted)}.profile .badge{display:inline-block;margin-top:8px;color:var(--gold);border:1px solid #ffc43d55;background:#ffc43d0d;border-radius:999px;padding:6px 10px;font-size:11px;font-weight:900}.empty{grid-column:1/-1;text-align:center;padding:40px;color:var(--muted);border:1px dashed var(--line);border-radius:18px}.back{text-align:center;margin:28px 0}.back a{color:var(--gold);font-weight:900;text-decoration:none}@media(max-width:1100px){.member-grid{grid-template-columns:repeat(4,minmax(0,1fr))}}@media(max-width:800px){.member-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.hero-top{align-items:flex-start}.hero-logo{width:62px;height:62px}.tools{grid-template-columns:1fr}.count{padding:10px}.profile-inner{align-items:flex-start}}@media(max-width:520px){.member-grid{grid-template-columns:1fr}.stats{grid-template-columns:1fr}.hero h1{font-size:36px}.hero p{font-size:13px}.logo{width:46px;height:46px}.profile-inner{flex-direction:column}}
</style></head><body><header><div class="nav"><img class="logo" src="tybmc-logo.svg" alt="TYBMC Clan-Wappen"><div class="brand"><strong>COLD N' DARK</strong><small>CLASH OF CLANS • TYBMC</small></div><a class="active" href="tybmc.html">TYBMC</a><a href="mitglieder.html">Cold N' Dark</a></div></header><main><section class="hero"><div class="hero-top"><img class="hero-logo" src="tybmc-logo.svg" alt="TYBMC Clan Logo"><div><span class="eyebrow">🎮 ZWEITER CLAN • LEVEL 6</span><h1><span>TYBMC</span></h1><p>Eigener Clan-Bereich mit Mitgliederübersicht und Spielerprofilen.</p></div></div><div class="stats"><div class="stat"><b id="countStat">31</b><span>MITGLIEDER</span></div><div class="stat"><b>🥇</b><span>GOLD LIGA 3</span></div><div class="stat"><b id="leaderStat">1</b><span>ANFÜHRER</span></div></div></section><div id="profile" class="profile"></div><div class="tools"><input id="search" class="search" type="search" placeholder="🔎 TYBMC-Spieler suchen …"><div id="count" class="count">31 / 31</div></div><section class="section-head"><h2>👥 TYBMC-Kader</h2><span>Stand 31.08.2026</span></section><section id="members" class="member-grid"></section><div class="back"><a href="index.html">← Zurück zur Cold N' Dark Startseite</a></div></main><script src="tybmc-members-data.js"></script><script>
const roleNames={leader:'Anführer',coLeader:'Vize-Anführer',admin:'Ältester',member:'Mitglied'},roleIcons={leader:'🔥',coLeader:'🛡️',admin:'👑',member:'⚔️'};const members=Array.isArray(window.TYBMC_MEMBERS)?window.TYBMC_MEMBERS:[];const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const initials=name=>name.split(/\s+/).map(x=>x[0]).join('').slice(0,2).toUpperCase();function render(){const term=document.getElementById('search').value.trim().toLowerCase();const visible=members.filter(m=>!term||m.name.toLowerCase().includes(term));document.getElementById('count').textContent=visible.length+' / '+members.length;document.getElementById('members').innerHTML=visible.length?visible.map(m=>{const i=members.indexOf(m),role=roleNames[m.role]||'Mitglied';return `<article class="member"><a class="member-link" href="#profile" onclick="openProfile(${JSON.stringify(m.name)});return false;"><div class="topline"><span class="rank">#${String(i+1).padStart(2,'0')}</span><span class="role-pill">${roleIcons[m.role]||'⚔️'} ${esc(role)}</span></div><div class="avatar">${esc(initials(m.name))}</div><div class="name">${esc(m.name)}</div><div class="sub">${esc(role)} • Profil ansehen →</div></a></article>`}).join(''):'<div class="empty">🔎 Kein Spieler gefunden.</div>'}function showProfile(nameOverride){const name=nameOverride||new URLSearchParams(location.search).get('spieler');const m=members.find(x=>x.name===name);const box=document.getElementById('profile');if(!m){box.classList.remove('show');return}const role=roleNames[m.role]||'Mitglied';box.innerHTML=`<div class="profile-inner"><div class="profile-avatar">${esc(initials(m.name))}</div><div><div class="eyebrow">👤 SPIELERPROFIL • TYBMC</div><h2>${esc(m.name)}</h2><p>Rolle im Clan: <strong>${esc(role)}</strong></p><p>Clan: <strong>TYBMC</strong> • Liga: <strong>Gold Liga 3</strong></p><span class="badge">${roleIcons[m.role]||'⚔️'} ${esc(role)}</span></div></div>`;box.classList.add('show');box.scrollIntoView({behavior:'smooth',block:'start'})}function openProfile(name){history.replaceState({},'', '?spieler='+encodeURIComponent(name));showProfile(name)}document.getElementById('search').addEventListener('input',render);render();showProfile();
</script></body></html>

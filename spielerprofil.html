<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090611"><title>Cold N' Dark – Spielerprofil</title><style>:root{--bg:#08050f;--panel:#151020;--gold:#ffc43d;--text:#f8f5ff;--muted:#aaa1bb;--line:#ffffff18;--green:#65e26e;--red:#ff6b6b}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% -8%,#4b286d 0,#21142f 25%,#090611 63%);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif}.nav{max-width:1100px;margin:auto;padding:12px 18px;display:flex;align-items:center;gap:14px;border-bottom:1px solid var(--line)}.logo{width:52px;height:52px;border:2px solid var(--gold);border-radius:14px}.brand{flex:1}.brand strong{display:block;letter-spacing:2px}.brand small{color:var(--gold);font-weight:900}.back{color:var(--gold);text-decoration:none;font-weight:900}main{max-width:1100px;margin:auto;padding:30px 18px 70px}.hero,.card{border:1px solid var(--line);border-radius:20px;background:linear-gradient(145deg,#1b1428ee,#100c18e8);padding:22px;box-shadow:0 14px 35px #0007;margin-bottom:16px}.hero{text-align:center;border-color:#ffc43d35}.eyebrow{color:var(--gold);font-size:11px;font-weight:900;letter-spacing:1px}.avatar{width:86px;height:86px;margin:14px auto;border-radius:22px;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#59327f,#1c132b 70%);border:1px solid #a66cff44;font-size:25px;font-weight:1000}.hero h1{margin:4px 0;font-size:42px}.sub{color:var(--muted)}.status{display:inline-block;margin-top:12px;padding:7px 12px;border-radius:999px;font-weight:900}.very{color:var(--green);border:1px solid #65e26e55;background:#65e26e0d}.regular{color:var(--gold);border:1px solid #ffc43d55;background:#ffc43d0d}.rare{color:var(--red);border:1px solid #ff6b6b55;background:#ff6b6b0d}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:9px}.stat{text-align:center;padding:13px 6px;border:1px solid var(--line);border-radius:13px;background:#ffffff06}.stat b{display:block;color:var(--gold);font-size:24px}.stat span{font-size:10px;color:var(--muted);font-weight:800}.month{display:grid;grid-template-columns:1fr auto auto auto;gap:10px;align-items:center;padding:13px;border-bottom:1px solid var(--line)}.month:last-child{border-bottom:0}.month span{color:var(--muted);font-size:13px;text-align:center}.warrow{display:grid;grid-template-columns:1fr auto auto auto;gap:10px;align-items:center;padding:12px;border-bottom:1px solid var(--line)}.warrow:last-child{border-bottom:0}.gold{color:var(--gold)}.empty{text-align:center;color:var(--muted);padding:30px}@media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}.month,.warrow{grid-template-columns:1fr 1fr}.hero h1{font-size:34px}}</style></head><body><div class="nav"><img class="logo" src="Wappen.png" alt="Wappen"><div class="brand"><strong>COLD N' DARK</strong><small>SPIELERPROFIL</small></div><a class="back" href="mitglieder.html">← Mitglieder</a></div><main><section id="profile" class="hero"><div class="empty">⏳ Profil wird geladen …</div></section><section class="card"><h2>⚔️ Kriegsstatistik – aktueller Monat</h2><div id="currentStats" class="stats"></div></section><section class="card"><h2>📅 Monatsübersicht</h2><div id="months"><div class="empty">Wird geladen …</div></div></section><section class="card"><h2>⚔️ Letzte Kriege</h2><div id="wars"><div class="empty">Wird geladen …</div></div></section></main><script>
const U='https://jvgqvtnqncelbhuordzy.supabase.co',K='sb_publishable_4PusmhJVMm0b3Bm-2Y-FPQ__tnZZzZO',H={apikey:K,Authorization:'Bearer '+K},q=new URLSearchParams(location.search),id=q.get('id'),name=q.get('name');const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const n=v=>Number(v||0);const monthName=d=>d.toLocaleDateString('de-DE',{month:'long',year:'numeric'});async function get(x){const r=await fetch(U+x,{headers:H});if(!r.ok)throw Error(await r.text());return r.json()}async function load(){if(!id&&!name){document.getElementById('profile').innerHTML='<div class="empty">Kein Spieler ausgewählt.</div>';return}try{const selector=id?'id=eq.'+encodeURIComponent(id):'name=eq.'+encodeURIComponent(name);const members=await get('/rest/v1/clan_members?select=id,name,role,trophies,town_hall_level&'+selector);const m=members[0];if(!m)throw Error('Spieler nicht gefunden.');const [rows,wars]=await Promise.all([get('/rest/v1/clan_war_members?select=*&member_id=eq.'+encodeURIComponent(m.id)+'&order=id.desc'),get('/rest/v1/clan_wars?select=id,opponent,created_at,war_size,status,result&order=created_at.desc')]);const warMap=new Map(wars.map(w=>[String(w.id),w]));rows.forEach(r=>r.war=warMap.get(String(r.war_id)));const now=new Date(),key=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0'),current=rows.filter(r=>r.war?.created_at?.slice(0,7)===key);const attacks=current.reduce((a,r)=>a+n(r.attacks),0),stars=current.reduce((a,r)=>a+n(r.stars),0),dest=current.reduce((a,r)=>a+n(r.destruction),0),avg=attacks?dest/attacks:0,statusClass=current.length>=4?'very':current.length>=2?'regular':'rare',statusText=current.length>=4?'🟢 Sehr aktiv':current.length>=2?'🟡 Regelmäßig dabei':'🔴 Selten dabei';document.getElementById('profile').innerHTML='<div class="eyebrow">👤 SPIELERPROFIL</div><div class="avatar">'+esc((m.name||'').split(/\s+/).map(x=>x[0]).join('').slice(0,2).toUpperCase())+'</div><h1>'+esc(m.name)+'</h1><div class="sub">'+esc(m.role||'Mitglied')+' • TH '+n(m.town_hall_level)+' • '+n(m.trophies)+' Trophäen</div><div class="status '+statusClass+'">'+statusText+'</div>';document.getElementById('currentStats').innerHTML='<div class="stat"><b>'+current.length+'</b><span>KRIEGE</span></div><div class="stat"><b>'+attacks+'</b><span>ANGRIFFE</span></div><div class="stat"><b>'+stars+'</b><span>STERNE</span></div><div class="stat"><b>'+Math.round(avg*10)/10+'%</b><span>Ø ZERSTÖRUNG</span></div><div class="stat"><b>'+current.filter(r=>n(r.attacks)>=2).length+'</b><span>2 ANGRIFFE</span></div>';const groups={};rows.forEach(r=>{if(!r.war?.created_at)return;const k=r.war.created_at.slice(0,7);if(!groups[k])groups[k]={label:monthName(new Date(k+'-01')),wars:0,attacks:0,stars:0,dest:0};groups[k].wars++;groups[k].attacks+=n(r.attacks);groups[k].stars+=n(r.stars);groups[k].dest+=n(r.destruction)});const ms=Object.values(groups);document.getElementById('months').innerHTML=ms.length?ms.map(g=>'<div class="month"><b>'+esc(g.label)+'</b><span>⚔️ '+g.wars+' Kriege</span><span>⭐ '+g.stars+'</span><span>🎯 '+g.attacks+' Angriffe</span></div>').join(''):'<div class="empty">Noch keine Kriegsteilnahmen vorhanden.</div>';document.getElementById('wars').innerHTML=rows.slice(0,12).map(r=>'<div class="warrow"><b>'+esc(r.war?.opponent||'Krieg')+'</b><span>⚔️ '+n(r.attacks)+'</span><span>⭐ '+n(r.stars)+'</span><span class="gold">💥 '+n(r.destruction)+'%</span></div>').join('')||'<div class="empty">Noch keine Kriege vorhanden.</div>'}catch(e){document.getElementById('profile').innerHTML='<div class="empty">❌ '+esc(e.message)+'</div>';console.error(e)}}load();</script></body></html>

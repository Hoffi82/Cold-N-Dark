<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#09070d"><title>Cold N' Dark – Clan-Chat</title><style>:root{--bg:#09070d;--panel:#171122;--panel2:#21172d;--gold:#ffc43d;--text:#f7f4ff;--muted:#b9b2c9;--line:#ffffff1f;--green:#45d483;--red:#e45b5b}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0,#302044,#09070d 65%);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;min-height:100vh;padding-bottom:90px}.bar{position:sticky;top:0;z-index:20;background:#08060df2;backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}.barin{max-width:760px;margin:auto;padding:11px 15px;display:flex;align-items:center;gap:12px}.logo{width:50px;height:50px;border-radius:14px;border:2px solid var(--gold);object-fit:cover}.brand{flex:1}.brand strong{display:block;letter-spacing:1.5px}.brand small{color:var(--gold);font-weight:900}.back{color:var(--gold);text-decoration:none;font-weight:900;font-size:13px}main{max-width:760px;margin:auto;padding:18px 13px}.hero{text-align:center;padding:12px 0 18px}.hero h1{margin:4px 0;font-size:38px}.hero h1 span{color:var(--gold)}.hero p{margin:0;color:var(--muted)}.chat{height:calc(100vh - 260px);min-height:420px;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:20px;background:linear-gradient(145deg,#171122dd,#0e0a13ee);overflow:hidden;box-shadow:0 15px 40px #0008}.messages{flex:1;overflow:auto;padding:16px}.msg{max-width:82%;margin:0 0 12px}.msg.mine{margin-left:auto}.bubble{padding:10px 12px;border:1px solid var(--line);border-radius:15px;background:#21172d}.mine .bubble{background:#3a2a18;border-color:#ffc43d45}.meta{font-size:10px;color:var(--muted);margin:0 4px 4px}.meta b{color:var(--gold)}.text{font-size:14px;white-space:pre-wrap;word-break:break-word}.time{font-size:9px;color:#82788e;margin-top:4px;text-align:right}.system{text-align:center;color:var(--muted);font-size:11px;padding:25px}.composer{padding:11px;border-top:1px solid var(--line);display:flex;gap:8px;background:#0c0911}.composer textarea{flex:1;resize:none;min-height:46px;max-height:110px;border:1px solid var(--line);border-radius:13px;background:#171122;color:var(--text);padding:11px;font:inherit;outline:none}.send{border:0;border-radius:13px;background:linear-gradient(135deg,var(--gold),#ff9f1c);color:#171122;font-weight:950;padding:0 17px;cursor:pointer}.send:disabled{opacity:.5}.notice{margin-top:10px;text-align:center;color:var(--muted);font-size:11px}.modal{position:fixed;inset:0;z-index:50;background:#000b;display:grid;place-items:center;padding:18px}.modalbox{width:min(440px,100%);border:1px solid #ffc43d55;border-radius:22px;background:linear-gradient(145deg,#21172d,#0f0b14);padding:24px;box-shadow:0 25px 70px #000}.modalbox h2{margin:0 0 6px}.modalbox p{color:var(--muted);font-size:13px}.modalbox label{display:block;color:var(--gold);font-weight:900;font-size:12px;margin:18px 0 6px}.nameinput{width:100%;padding:13px;border:1px solid var(--line);border-radius:12px;background:#0d0a12;color:var(--text);font:inherit}.enter{width:100%;margin-top:12px;padding:13px;border:0;border-radius:13px;background:linear-gradient(135deg,var(--gold),#ff9f1c);color:#171122;font-weight:950;cursor:pointer}.error{color:var(--red);font-size:12px;margin-top:8px;min-height:18px}.hidden{display:none!important}@media(max-width:500px){.chat{height:calc(100vh - 245px);min-height:400px}.hero h1{font-size:32px}.send{padding:0 13px}}
</style></head><body><header class="bar"><div class="barin"><img class="logo" src="Wappen.png" alt="Cold N' Dark"><div class="brand"><strong>COLD N' DARK</strong><small>CLAN-CHAT</small></div><a class="back" href="index.html">← Zurück</a></div></header><main><section class="hero"><h1>💬 <span>Clan-Chat</span></h1><p>Der Treffpunkt für Cold N' Dark.</p></section><section class="chat"><div id="messages" class="messages"><div class="system">⏳ Chat wird geladen …</div></div><form id="composer" class="composer"><textarea id="message" maxlength="500" placeholder="Nachricht schreiben …" aria-label="Nachricht"></textarea><button class="send" id="send" type="submit">Senden</button></form></section><div class="notice">Bitte fair und respektvoll miteinander umgehen. 👊</div></main><div id="nameModal" class="modal"><div class="modalbox"><h2>💬 Willkommen im Clan-Chat</h2><p>Damit jeder weiß, wer schreibt, wähle deinen <b>Clan-Namen</b> aus.</p><label for="playerName">Dein Spielername</label><input id="playerName" class="nameinput" list="memberList" autocomplete="off" placeholder="z. B. Coc Hoffi"><datalist id="memberList"></datalist><button id="enter" class="enter">Chat betreten</button><div id="nameError" class="error"></div></div></div><script>const U='https://jvgqvtnqncelbhuordzy.supabase.co',K='sb_publishable_4PusmhJVMm0b3Bm-2Y-FPQ__tnZZzZO',H={apikey:K,Authorization:'Bearer '+K,'Content-Type':'application/json'};const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let me=null,members=[];async function get(path){const r=await fetch(U+path,{headers:H});if(!r.ok)throw Error(await r.text());return r.json()}async function loadMembers(){try{members=await get('/rest/v1/clan_members?select=id,name,role,active&active=eq.true&order=name.asc');$('memberList').innerHTML=members.map(m=>'<option value="'+esc(m.name)+'">').join('')}catch(e){$('nameError').textContent='Mitglieder konnten nicht geladen werden.'}}function saved(){try{return JSON.parse(localStorage.getItem('cnd_chat_user')||'null')}catch{return null}}async function enterChat(){const value=$('playerName').value.trim();const found=members.find(m=>m.name.toLowerCase()===value.toLowerCase());if(!found){$('nameError').textContent='Bitte genau deinen vorhandenen Clan-Namen auswählen.';return}me={id:String(found.id),name:found.name,role:found.role};localStorage.setItem('cnd_chat_user',JSON.stringify(me));$('nameModal').classList.add('hidden');await loadMessages()}function render(rows){const box=$('messages');if(!rows.length){box.innerHTML='<div class="system">Noch keine Nachrichten. Sei der Erste! 👋</div>';return}box.innerHTML=rows.map(r=>{const mine=me&&String(r.member_id)===me.id;const t=new Date(r.created_at);return '<div class="msg '+(mine?'mine':'')+'"><div class="meta"><b>'+esc(r.member_name||'Clan-Mitglied')+'</b>'+(r.is_admin?' 👑':'')+'</div><div class="bubble"><div class="text">'+esc(r.message)+'</div><div class="time">'+t.toLocaleString('de-DE',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})+'</div></div></div>'}).join('');box.scrollTop=box.scrollHeight}async function loadMessages(){try{const rows=await get('/rest/v1/clan_chat_messages?select=id,member_id,member_name,message,is_admin,created_at&order=created_at.asc&limit=200');render(rows)}catch(e){$('messages').innerHTML='<div class="system">❌ Der Chat-Speicher ist noch nicht mit Supabase verbunden.<br>Die Chat-Tabelle muss einmal angelegt werden.</div>';console.error(e)}}$('enter').addEventListener('click',enterChat);$('playerName').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();enterChat()}});$('composer').addEventListener('submit',async e=>{e.preventDefault();if(!me)return;const input=$('message'),message=input.value.trim();if(!message)return;$('send').disabled=true;try{const r=await fetch(U+'/rest/v1/clan_chat_messages',{method:'POST',headers:{...H,Prefer:'return=minimal'},body:JSON.stringify({member_id:me.id,member_name:me.name,message,is_admin:['leader','coLeader'].includes(me.role)})});if(!r.ok)throw Error(await r.text());input.value='';await loadMessages()}catch(err){alert('Nachricht konnte nicht gesendet werden. Die Chat-Tabelle muss zuerst eingerichtet werden.')}finally{$('send').disabled=false}});const old=saved();loadMembers().then(()=>{if(old){const found=members.find(m=>String(m.id)===String(old.id));if(found){me={id:String(found.id),name:found.name,role:found.role};$('nameModal').classList.add('hidden');loadMessages()}}});setInterval(()=>{if(me)loadMessages()},5000);</script></body></html>
